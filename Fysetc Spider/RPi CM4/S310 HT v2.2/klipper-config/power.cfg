########################################
# POWER configuration
########################################

[gcode_macro M81]
description: При нажатии принтер будет выключен. Недоступно при печати.
gcode:
  {action_call_remote_method("shutdown_machine")}

[gcode_macro REBOOT]
description: При нажатии принтер будет перезагружен. Недоступно при печати.
gcode:
  {action_call_remote_method("reboot_machine")}

[gcode_macro CHANGE_POWEROFF]
description: При нажатии изменяет состояние отключения принтера после печати или сушки 
gcode:
  {% set svv = printer.save_variables.variables %}
  {% if not svv.change_poweroff %}
    RESPOND PREFIX="[+]" MSG="Автовыключение активировано"
    SAVE_VARIABLE VARIABLE=change_poweroff VALUE=True
  {% else %}
    RESPOND PREFIX="[+]" MSG="Автовыключение отключено"
    SAVE_VARIABLE VARIABLE=change_poweroff VALUE=False
  {% endif %}
