########################################
# BED LEVEL configuration
########################################

[probe]
pin: PA0
x_offset: 0.0
y_offset: 0.0
z_offset: -1.0
speed: 0.8
lift_speed: 25
samples: 1
sample_retract_dist: 2.0
samples_result: average
samples_tolerance: 0.04
samples_tolerance_retries: 0

[bed_mesh]
speed: 180
horizontal_move_z: 2
mesh_min:
    10,0
mesh_max:
    390,390
probe_count: 6,6

[gcode_macro G29]
description: Автокалибровка карты.
gcode:
  {% if "xy" not in printer.toolhead.homed_axes %}
    G28 X Y
  {% endif %}
  {% if "z" not in printer.toolhead.homed_axes %}
    G28 Z
  {% endif %}
  BED_MESH_CALIBRATE

[safe_z_home]
home_xy_position: 210,200
speed: 90
z_hop:10
z_hop_speed: 15
move_to_previous: True

[quad_gantry_level]
gantry_corners: 
    -30, 0
    420, 400
points:
    10, 0
    10, 390
    400, 390
    400, 10
speed: 300
retries: 10
retry_tolerance: 0.05
horizontal_move_z: 10
