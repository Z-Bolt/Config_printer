########################################
# FILAMENT SENSOR configuration
########################################

[filament_switch_sensor Filament_Sensor0]
pause_on_runout: False
runout_gcode:
   {% if printer.idle_timeout.state == "Printing" %}
      {% if printer.pause_resume.is_paused == True %}
         RESPOND PREFIX="[+]" MSG="Принтер уже в паузе"
      {% else %}
         PAUSE
      {% endif %}
      G92 E0
      G1 E40 F100
      RESPOND TYPE="error" MSG="Проверьте филамент"
      G1 E-10 F100
      G1 E-20 F300
      G1 E-200 F1500
      G92 E0 
      RESPOND PREFIX="[+]" MSG="Филамент выгружен, загрузите новый"
   {% endif %}
switch_pin: PC3 #T3
