[output_pin sol]
pin: PB15 # HEAT0
pwm: True
value: 1
shutdown_value:1

[gcode_macro _SOL_ON]
gcode:
	SET_PIN PIN=sol VALUE=1

[gcode_macro _SOL_OFF]
gcode:
	SET_PIN PIN=sol VALUE=0	

[gcode_macro _PARK_extruder]
gcode:
   {% set svv = printer.save_variables.variables %}
	SAVE_GCODE_STATE NAME=park0
	M220 S100
	G90
   	G1 X{svv.t0x_safe} Y{svv.t0y_safe} F{svv.speed_fast}
   	G1 X{svv.t0x_safe} Y{svv.t0y_park} F{svv.speed_fast}
   	G1 X{svv.t0x_park} Y{svv.t0y_park} F{svv.speed_slow}
	SET_PIN PIN=sol VALUE=0
	G4 P{svv.delay}
   	G1 X{svv.t0x_park} Y{svv.t0y_safe} F{svv.speed_slow}
	RESTORE_GCODE_STATE NAME=park0
	
[gcode_macro _PARK_extruder0]
gcode:
   _PARK_extruder

[gcode_macro _GET_extruder]
gcode:
   {% set svv = printer.save_variables.variables %}
	SAVE_GCODE_STATE NAME=get0
	M220 S100
	G90
	SET_GCODE_OFFSET X=0
	SET_GCODE_OFFSET Y=0
	SET_PIN PIN=sol VALUE=1
	G1 X{svv.t0x_park} Y{svv.t0y_safe} F{svv.speed_fast}
   	G1 X{svv.t0x_park} Y{svv.t0y_park} F{svv.speed_slow}
	#_jerk_extruder
	G1 X{svv.t0x_safe} Y{svv.t0y_park} F{svv.speed_slow}
	RESTORE_GCODE_STATE NAME=get0
	SET_GCODE_OFFSET X=0
	SET_GCODE_OFFSET Y=0
	SET_GCODE_OFFSET Z=0

[gcode_macro _GET_extruder0]
gcode:
   _GET_extruder

[gcode_macro _PARK_extruder1]
gcode:
   {% set svv = printer.save_variables.variables %}
	SAVE_GCODE_STATE NAME=park1
	M220 S100
	G90
   	G1 X{svv.t1x_safe} Y{svv.t1y_safe} F{svv.speed_fast}
   	G1 X{svv.t1x_safe} Y{svv.t1y_park} F{svv.speed_fast}
   	G1 X{svv.t1x_park} Y{svv.t1y_park} F{svv.speed_slow}
	SET_PIN PIN=sol VALUE=0
	G4 P{svv.delay}
   	G1 X{svv.t1x_park} Y{svv.t1y_safe} F{svv.speed_slow}
	RESTORE_GCODE_STATE NAME=park1

[gcode_macro _GET_extruder1]
gcode:
	{% set svv = printer.save_variables.variables %}
	SAVE_GCODE_STATE NAME=get1
	M220 S100
	G90
	SET_GCODE_OFFSET X=0
	SET_GCODE_OFFSET Y=0 
	SET_PIN PIN=sol VALUE=1
	G1 X{svv.t1x_park} Y{svv.t1y_safe} F{svv.speed_fast}
   	G1 X{svv.t1x_park} Y{svv.t1y_park} F{svv.speed_slow}
	#_jerk_extruder1
	G1 X{svv.t1x_safe} Y{svv.t1y_park} F{svv.speed_slow}
	RESTORE_GCODE_STATE NAME=get1
	SET_GCODE_OFFSET X={svv.t1_x_offset}
	SET_GCODE_OFFSET Y={svv.t1_y_offset}
	SET_GCODE_OFFSET Z={svv.t1_z_offset}
 

[gcode_macro _push_extruder0]
gcode:
   	{% set svv = printer.save_variables.variables %}
	{% set push_x = svv.t0x_park + 5 %}
	{% set push_y = svv.t0y_park + 15 %}
   	SAVE_GCODE_STATE NAME=push0
   	G90
   	G1 X{push_x} Y{push_y} F{svv.speed_fast}
	G91
	_SOL_ON
	G1 Y-5.8 F300
	G4 P{svv.delay}
	G1 Y5.5 F3000
	G90
   	G1 X{svv.t0x_safe} Y{svv.t0y_safe} F{svv.speed_fast}
   	RESTORE_GCODE_STATE NAME=push0

[gcode_macro _push_extruder1]
gcode:
   	{% set svv = printer.save_variables.variables %}
	{% set push_x = svv.t1x_park - 5 %}
	{% set push_y = svv.t1y_park + 15 %}
   	SAVE_GCODE_STATE NAME=push1
   	G90
   	G1 X{push_x} Y{push_y} F{svv.speed_fast}
	G91
	_SOL_ON
	G1 Y-5.5 F300
	G4 P{svv.delay}
	G1 Y5 F3000
	G90
   	G1 X{svv.t1x_safe} Y{svv.t1y_safe} F{svv.speed_fast}
   	RESTORE_GCODE_STATE NAME=push1	

[gcode_macro T0]
gcode:
   {% set ratio = printer.virtual_sdcard.progress %}
   {% if ratio == 0 %}
      PROGRESS_EXTRUDER
   {% endif %}
   {% if "xyz" not in printer.toolhead.homed_axes %}
   G28 
   {% endif %}
   _PARK_{printer.toolhead.extruder}
   ACTIVATE_EXTRUDER EXTRUDER=extruder
   _GET_extruder
   G4 P2000

[gcode_macro T1]
gcode:
   {% set ratio = printer.virtual_sdcard.progress %}
   {% if ratio == 0 %}
      PROGRESS_EXTRUDER1
   {% endif %}
   {% if "xyz" not in printer.toolhead.homed_axes %}
   G28
   {% endif %}
   _PARK_{printer.toolhead.extruder}
   ACTIVATE_EXTRUDER EXTRUDER=extruder1
   _GET_extruder1
   G4 P2000

[gcode_macro _GT1]
gcode:
	{% set T1ProbeValue = printer.probe.last_z_result|default(0)|float %}
	{% set probeConfig = printer['configfile'].config["probe"] %}
	{% if probeConfig %}
	{% set ProbeOffset = probeConfig.z_offset|default(0)|float %}
	{% endif %}
	{% set T1OffsetZ = (T1ProbeValue - ProbeOffset)|round(3) %}
	M118 Probe offset is {ProbeOffset}
	M118 Last probe is {T1ProbeValue}
	M118 Tool1 offset is {T1OffsetZ}
	SAVE_VARIABLE VARIABLE=t1_z_offset VALUE={T1OffsetZ}

[gcode_macro Zoffset]
description: Макрос автокалибровки z-офсета 2-й головы. Запускайте его при снятии или после замены хотенда.
gcode:
    G28
    T0 ;first tool
    ; Heat up both tools:
    M104 T0 S160
    M104 T1 S160
    M109 T0 S160
    M109 T1 S160
	RESPOND PREFIX="[+]" MSG="Термостабилизация - 1 минута"
    G4 P60000 ; 1 minute pause
	RESPOND PREFIX="[+]" MSG="Термостабилизация завершена"
    ; calibrate z0 coordinate:
    G90
    G1 X150 Y150 F9000 ; go to the center of heat bed
    PROBE
    G1 Z2 F1200
    PROBE
    G1 Z2 F1200
    G28
    T1 ; second tool
    G1 X150 Y150 F9000 ; go to the center of heat bed
    ; probing:
    PROBE
    G1 Z2 F1200
    PROBE
    G1 Z2 F1200
    PROBE
    G1 Z2 F1200
    _GT1 ; write t1 offset into variables.cfg
    T0 ;first tool
    TURN_OFF_HEATERS
    RESTART