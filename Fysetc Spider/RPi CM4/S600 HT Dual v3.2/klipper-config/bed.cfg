########################################
# BED LEVEL configuration
########################################
[probe]
pin: PA0
x_offset: 0.0
y_offset: 0.0
z_offset: -1.0
speed: 0.8
lift_speed: 25
samples: 1
sample_retract_dist: 2.0
samples_result: average
samples_tolerance: 0.04
samples_tolerance_retries: 0

[bed_mesh]
speed: 300
horizontal_move_z: 2
mesh_min:
    10,10
mesh_max:
    590,590
probe_count: 6,6
# compensation_amplitude: 0.1
# x_coordinate_min: 0
# x_coordinate_max: 600

[gcode_macro G29]
description: Автокалибровка карты.
gcode:
  {% if "xy" not in printer.toolhead.homed_axes %}
    G28 X Y
  {% endif %}
  {% if "z" not in printer.toolhead.homed_axes %}
    G28 Z
  {% endif %}
  BED_MESH_CALIBRATE

[quad_gantry_level]
gantry_corners: 
    -55, 0
    660, 640
points:
    10, 10
    10, 590
    590, 590
    590, 10
speed: 300
retries: 7
retry_tolerance: 0.05
horizontal_move_z: 10

[gcode_macro SET_GCODE_OFFSET]
rename_existing: _SET_GCODE_OFFSET_ORIGINAL
gcode:
	{% set svv = printer.save_variables.variables %}
	{% set old_z = svv.offset_z|float %}
	_SET_GCODE_OFFSET_ORIGINAL {rawparams}
	{% set new_z = printer.gcode_move.homing_origin.z|float %}
	{% set delta = (new_z - old_z)|round(5) %}
	{% if delta|abs > 0.00001 %}
		{% set new_z_offset = (svv.offset_z|default(0)|float + delta)|round(5) %}
		SAVE_VARIABLE VARIABLE=offset_z VALUE={new_z_offset}
	{% endif %}

[gcode_macro _SET_GCODE_OFFSET_INTERNAL]
gcode:
	_SET_GCODE_OFFSET_ORIGINAL {rawparams}

[delayed_gcode delayed_offset_z]
gcode:
	{% set svv = printer.save_variables.variables %}
	{% set offset_z = (svv.offset_z|default(0)|float)|round(5) %}
	_SET_GCODE_OFFSET_INTERNAL Z={offset_z}
initial_duration: 1
