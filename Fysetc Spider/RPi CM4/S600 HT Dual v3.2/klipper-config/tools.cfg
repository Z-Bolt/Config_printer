########################################
# TOOLS configuration
########################################

[gcode_macro _PARK_EXTRUDER]
gcode:
   {% set svv = printer.save_variables.variables %}
   SAVE_GCODE_STATE NAME=park0
   G1 X{svv.t0x_safe} Y{svv.t0y_safe} F{svv.speed_fast}
   G1 X{svv.t0x_safe} Y{svv.t0y_park + 10} F{svv.speed_fast}
   G1 X{svv.t0x_safe} Y{svv.t0y_safe} F{svv.speed_fast}
   G1 X{svv.t0x_safe} Y{svv.t0y_park} F{svv.speed_fast}
   G1 X{svv.t0x_park + 50} Y{svv.t0y_park} F{svv.speed_fast}
   G1 X{svv.t0x_park} Y{svv.t0y_park} F{svv.speed_slow}
   G1 X{svv.t0x_park} Y{svv.t0y_safe} F{svv.speed_slow}
   RESTORE_GCODE_STATE NAME=park0

[gcode_macro _PARK_EXTRUDER0]
gcode:
   _PARK_EXTRUDER

[gcode_macro _GET_EXTRUDER]
gcode:
   {% set svv = printer.save_variables.variables %}
   SAVE_GCODE_STATE NAME=get0
   G90
   SET_GCODE_OFFSET X=0
	SET_GCODE_OFFSET Y=0
   G1 X{svv.t0x_park} Y{svv.t0y_safe} F{svv.speed_fast}
   G1 X{svv.t0x_park} Y{svv.t0y_park} F{svv.speed_slow}
   _jerk_extruder
   G1 X{svv.t0x_safe} Y{svv.t0y_park} F{svv.speed_fast}
   G1 X{svv.t0x_safe} Y{svv.t0y_safe + 15} F{svv.speed_fast}
   #G1 X{svv.t0x_safe} Y{svv.t0y_safe} F{svv.speed_fast}
   RESTORE_GCODE_STATE NAME=get0
   SET_GCODE_OFFSET X=0
   SET_GCODE_OFFSET Y=0
   SET_GCODE_OFFSET Z=0

[gcode_macro _GET_EXTRUDER0]
gcode:
   _GET_EXTRUDER

[gcode_macro _PARK_EXTRUDER1]
gcode:
   {% set svv = printer.save_variables.variables %}
   SAVE_GCODE_STATE NAME=park1
   G90
   G1 X{svv.t1x_safe} Y{svv.t1y_safe} F{svv.speed_fast}
   G1 X{svv.t1x_safe} Y{svv.t1y_park + 10} F{svv.speed_fast}
   G1 X{svv.t1x_safe} Y{svv.t1y_safe} F{svv.speed_fast}
   G1 X{svv.t1x_safe} Y{svv.t1y_park} F{svv.speed_fast}
   G1 X{svv.t1x_park - 50} Y{svv.t1y_park} F{svv.speed_fast}
   G1 X{svv.t1x_park} Y{svv.t1y_park} F{svv.speed_slow}
   G1 X{svv.t1x_park} Y{svv.t1y_safe} F{svv.speed_slow} 
   RESTORE_GCODE_STATE NAME=park1

[gcode_macro _GET_EXTRUDER1]
gcode:
   {% set svv = printer.save_variables.variables %}
   SAVE_GCODE_STATE NAME=get1
   G90
   SET_GCODE_OFFSET X=0 # {svv.t1_x_offset}
	SET_GCODE_OFFSET Y=0 # {svv.t1_y_offset}
   G1 X{svv.t1x_park} Y{svv.t1y_safe} F{svv.speed_fast}
   G1 X{svv.t1x_park} Y{svv.t1y_park} F{svv.speed_slow}
   _jerk_extruder1
   G1 X{svv.t1x_safe} Y{svv.t1y_park} F{svv.speed_fast}
   G1 X{svv.t1x_safe} Y{svv.t1y_safe + 15} F{svv.speed_fast}
   #G1 X{svv.t1x_safe} Y{svv.t1y_safe} F{svv.speed_fast}
   RESTORE_GCODE_STATE NAME=get1
   SET_GCODE_OFFSET X={svv.t1_x_offset}
   SET_GCODE_OFFSET Y={svv.t1_y_offset}
   SET_GCODE_OFFSET Z={svv.t1_z_offset}

[gcode_macro _jerk_extruder]
gcode:
   {% set svv = printer.save_variables.variables %}
   G91
   G1 Y{svv.t0y_jerk} F{svv.speed_fast}
   G1 Y-{svv.t0y_jerk} F{svv.speed_fast}
   G90

[gcode_macro _jerk_extruder1]
gcode:
   {% set svv = printer.save_variables.variables %}
   G91
   G1 Y{svv.t1y_jerk} F{svv.speed_fast}
   G1 Y-{svv.t1y_jerk} F{svv.speed_fast}
   G90

[gcode_macro T0]
gcode:
   {% if "xyz" not in printer.toolhead.homed_axes %}
      G28
      ACTIVATE_EXTRUDER EXTRUDER=extruder
   {% endif %}
   _PARK_{printer.toolhead.extruder}
   ACTIVATE_EXTRUDER EXTRUDER=extruder
   _GET_extruder
   G4 P2000

[gcode_macro T1]
gcode:
   {% if "xyz" not in printer.toolhead.homed_axes %}
      G28
      ACTIVATE_EXTRUDER EXTRUDER=extruder
   {% endif %}
   _PARK_{printer.toolhead.extruder}
   ACTIVATE_EXTRUDER EXTRUDER=extruder1
   _GET_extruder1
   G4 P2000

[gcode_macro _GT1]
gcode:
	{% set T1ProbeValue = printer.probe.last_z_result|default(0)|float %}
	{% set probeConfig = printer['configfile'].config["probe"] %}
	{% if probeConfig %}
		{% set ProbeOffset = probeConfig.z_offset|default(0)|float %}
	{% endif %}
	{% set T1OffsetZ = (T1ProbeValue - ProbeOffset)|round(3) %}
	RESPOND PREFIX="[+]" MSG="Офсет T1 - {T1OffsetZ}мм"
	SAVE_VARIABLE VARIABLE=t1_z_offset VALUE={T1OffsetZ}

[gcode_macro Zoffset]
description: Макрос автокалибровки z-офсета 2-й головы. Запускайте его при снятии или замене хотендов.
gcode:
   {% set poz_x = printer.toolhead.axis_maximum.x|float / 2 %}
   {% set poz_y = printer.toolhead.axis_maximum.y|float / 2 %}
   G28
   M104 T0 S160
   M104 T1 S160
   M109 T0 S160
   M109 T1 S160
   RESPOND PREFIX="[+]" MSG="Термостабилизация - 1 минута"
   G4 P60000
   RESPOND PREFIX="[+]" MSG="Термостабилизация завершена"
   G90
   G1 X{poz_x} Y{poz_y} F9000
   PROBE
   G1 Z2 F1200
   PROBE
   G1 Z2 F1200
   G28
   T1
   G1 X{poz_x} Y{poz_y} F9000
   PROBE
   G1 Z2 F1200
   PROBE
   G1 Z2 F1200
   PROBE
   G1 Z2 F1200
   _GT1
   T0
   _PARK_EXTRUDER
   TURN_OFF_HEATERS
   FIRMWARE_RESTART

