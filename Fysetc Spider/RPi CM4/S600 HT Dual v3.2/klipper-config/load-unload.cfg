[gcode_macro LOAD_FILAMENT]
description: Макрос загрузки филамента. Проведите пруток через датчик филамента до подтягиващего экструдера, отогните прижимную лапку и просуньте филамент между шестерен. Загрузите филамент. 
gcode:
  {% set ActiveTool = printer.toolhead.extruder %}
  {% set tc = printer['zbolt_toolchanger'] %}
  {% if "xyz" not in printer.toolhead.homed_axes %}
  G28
  {% endif %}
  SAVE_GCODE_STATE NAME=load
  {% set cur_temp = printer[printer.toolhead.extruder].temperature|float %}
  {% set target_temp = printer[printer.toolhead.extruder].target|float %}
  {% if cur_temp < target_temp %}
      {% set wait_temp = target_temp %}
  {% else %}
      {% set wait_temp = cur_temp %}
  {% endif %}
  {% if wait_temp < 210 %}
      {% set wait_temp = 210 %}
  {% else %}
  {% endif %}
  M104 S{wait_temp}
  {% if ActiveTool == "extruder" %} # Active tool - tool0
    G1 X{tc.tools.t0.safe_x} Y{tc.tools.t0.park_y} F18000
  {% else %}                        # Active tool - tool1
    G1 X{tc.tools.t1.safe_x} Y{tc.tools.t1.park_y} F18000
  {% endif %}
  TEMPERATURE_WAIT SENSOR={printer.toolhead.extruder} MINIMUM={wait_temp}
  M82
  G92 E0
  {% if ActiveTool == "extruder" %} # Active tool - tool0
    G1 X{tc.tools.t0.safe_x} Y{tc.tools.t0.park_y} F18000
    FORCE_MOVE STEPPER="extruder_stepper _pulling_extruder" DISTANCE=1980 VELOCITY=50 ACCEL=30
  {% else %}                        # Active tool - tool1
    G1 X{tc.tools.t1.safe_x} Y{tc.tools.t1.park_y} F18000
    FORCE_MOVE STEPPER="extruder_stepper _pulling_extruder1" DISTANCE=1980 VELOCITY=50 ACCEL=30
  {% endif %} 
  G1 E20 F600
  G1 E60 F900
  G1 E80 F300
  G1 E100 F150
  G92 E0
  RESTORE_GCODE_STATE NAME=load

[gcode_macro UNLOAD_FILAMENT]
description: Макрос выгрузки филамента. Выполните данный макрос. Далее извлеките пруток из подтягивающего экструдера.
gcode:
  {% set ActiveTool = printer.toolhead.extruder %}
  {% set tc = printer['zbolt_toolchanger'] %}
  {% if "xyz" not in printer.toolhead.homed_axes %}
  G28
  {% endif %}
  SAVE_GCODE_STATE NAME=unload
  {% set cur_temp = printer[printer.toolhead.extruder].temperature|float %}
  {% set target_temp = printer[printer.toolhead.extruder].target|float %}
  {% if cur_temp < target_temp %}
      {% set wait_temp = target_temp %}
  {% else %}
      {% set wait_temp = cur_temp %}
  {% endif %}
  {% if wait_temp < 210 %}
      {% set wait_temp = 210 %}
  {% else %}
  {% endif %}
  M104 S{wait_temp}
  {% if ActiveTool == "extruder" %} # Active tool - tool0
    G1 X{tc.tools.t0.safe_x} Y{tc.tools.t0.park_y} F18000
  {% else %}                        # Active tool - tool1
    G1 X{tc.tools.t1.safe_x} Y{tc.tools.t1.park_y} F18000
  {% endif %}
  TEMPERATURE_WAIT SENSOR={printer.toolhead.extruder} MINIMUM={wait_temp}
  M82
  G92 E0
  G1 E10 F200
  G1 E-10 F900
  G1 E-30 F300
  G1 E-130 F900
  {% if ActiveTool == "extruder" %} # Active tool - tool0
    G1 X{tc.tools.t0.safe_x} Y{tc.tools.t0.park_y} F18000
    FORCE_MOVE STEPPER="extruder_stepper _pulling_extruder" DISTANCE=-1980 VELOCITY=50 ACCEL=30
  {% else %}                        # Active tool - tool1
    G1 X{tc.tools.t1.safe_x} Y{tc.tools.t1.park_y} F18000
    FORCE_MOVE STEPPER="extruder_stepper _pulling_extruder1" DISTANCE=-1980 VELOCITY=50 ACCEL=30
  {% endif %}
  G92 E0  
  RESTORE_GCODE_STATE NAME=unload
