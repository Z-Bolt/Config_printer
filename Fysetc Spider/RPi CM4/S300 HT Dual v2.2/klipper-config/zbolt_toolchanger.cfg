########################################
# TOOLS configuration
########################################

[output_pin sol]
pin: PB15 # HEAT0
pwm: True
value: 1
shutdown_value: 1

[zbolt_toolchanger]
initial_tool: 0
sensor_settle_time: 0.05
verify_retries: 1
travel_speed: 300
dock_speed: 60
force_speed_factor: 100
z_lift_before_home: 5
z_after_home: 5
z_lift_speed: 15
home_axes_order: y, x
after_home_position: 10, 290
# slider_sensor_pin: ^PXX            # датчик наличия головы на слайдере (в планах)
global_offset_variable: z_adjust
service_mode_variable: service_mode
apply_offset_gcode: _SET_GCODE_OFFSET_INTERNAL X={x} Y={y} Z={z}
on_fault_both_undocked: pause
on_fault_head_lost: pause
on_fault_slider_unexpected: pause
on_fault_park_failed: pause
on_fault_get_failed: pause
on_fault_unexpected_edge: pause
on_fault_sensor_unstable: error
on_fault_startup: error

[zbolt_toolchanger_tool t0]
tool_number: 0
extruder: extruder
dock_sensor_pin: ^!PA1
park_xy: 9.0, -61.0                     # бывш. t0x_park / t0y_park
unpark_xy: 9.0, -61.0                   # бывш. t0x_unpark / t0y_unpark
safe_xy: 64.0, -41.0                    # бывш. t0x_park + 55 / t0y_park + 20
stage_xy: 64.0, 0                       # заход на колонну парковки от Y0
exit_xy: 64.0, 0
retreat_speed: slow
coupling: solenoid                      # электромагнит на слайдере
solenoid_pin: sol
release_delay: 0.3                    
current_boost: 1.5                       
current_boost_phase: get
seat_offset_xy: 5, 15                    # _PUSH_EXTRUDER0
seat_jerk: 5.5                           
offset_z_variable: t0offset
after_change_gcode: RESTORE_SPEED_FACTOR

[zbolt_toolchanger_tool t1]
tool_number: 1
extruder: extruder1
dock_sensor_pin: ^!PB13
park_xy: 292.5, -61.0                   # бывш. t1x_park / t1y_park
unpark_xy: 292.5, -61.0                 # бывш. t1x_unpark / t1y_unpark
safe_xy: 237.5, -41.0                   # бывш. t1x_park - 55 / t1y_park + 20
stage_xy: 237.5, 0
exit_xy: 237.5, 0
retreat_speed: slow
coupling: solenoid
solenoid_pin: sol
release_delay: 0.3
current_boost: 1.5
current_boost_phase: get
seat_offset_xy: -5, 15                   # _PUSH_EXTRUDER1
seat_jerk: 5.5                           
offset_x_variable: t1_x_offset
offset_y_variable: t1_y_offset
offset_z_variable: t1_z_offset
after_change_gcode: RESTORE_SPEED_FACTOR

[gcode_macro Zoffset]
description: Макрос автокалибровки z-офсета 2-й головы. Запускайте его при снятии или замене хотендов.
gcode:
	TOOLCHANGER_CALIBRATE_OFFSET TOOL=1

[gcode_macro PARKING_STATE]
description: Показать, какая голова на слайдере, а какая в парковке.
gcode:
	TOOLCHANGER_STATUS
