########################################
# LOAD/UNLOAD configuration
########################################

[gcode_macro LOAD_FILAMENT]
description: Макрос загрузки филамента. Вставьте пруток в трубку и протолкните его до экструдера. Отогните прижимную лапку экструдера и просуньте филамент до шестерен. Загрузите филамент.
gcode:
  {% if "xyz" not in printer.toolhead.homed_axes %}
  G28
  {% endif %}
  SAVE_GCODE_STATE NAME=load
  G90
  G1 X150 Y60 F9000
  Z_MAX 
  {% set cur_temp = printer[printer.toolhead.extruder].temperature|float %}
  {% set target_temp = printer[printer.toolhead.extruder].target|float %}
  {% if cur_temp < target_temp %}
      {% set wait_temp = target_temp %}
  {% else %}
      {% set wait_temp = cur_temp %}
  {% endif %}
  {% if wait_temp < 210 %}
      {% set wait_temp = 210 %}
  {% else %}
  {% endif %}
  M104 S{wait_temp}
  TEMPERATURE_WAIT SENSOR={printer.toolhead.extruder} MINIMUM={wait_temp}
  M82
  G92 E0
  G1 E20 F600
  G1 E100 F1000
  G1 E110 F300
  G1 E120 F100
  G92 E0
  RESTORE_GCODE_STATE NAME=load

[gcode_macro UNLOAD_FILAMENT]
description: Макрос выгрузки филамента. Выполните данный макрос. Далее извлеките пруток из трубки.
gcode:
  {% if "xyz" not in printer.toolhead.homed_axes %}
  G28
  {% endif %}
  SAVE_GCODE_STATE NAME=unload
  G90
  G1 X150 Y60 F9000
  Z_MAX
  {% set cur_temp = printer[printer.toolhead.extruder].temperature|float %}
  {% set target_temp = printer[printer.toolhead.extruder].target|float %}
  {% if cur_temp < target_temp %}
      {% set wait_temp = target_temp %}
  {% else %}
      {% set wait_temp = cur_temp %}
  {% endif %}
  {% if wait_temp < 210 %}
      {% set wait_temp = 210 %}
  {% else %}
  {% endif %}
  M104 S{wait_temp}
  TEMPERATURE_WAIT SENSOR={printer.toolhead.extruder} MINIMUM={wait_temp}
  M82
  G92 E0
  G1 E10 F200
  G1 E-10 F2100
  G1 E-30 F150
  G1 E-170 F1500
  G92 E0  
  RESTORE_GCODE_STATE NAME=unload