########################################
# STEPPER configuration
########################################

[force_move]
enable_force_move: True  

[stepper_x]
step_pin: PE11 # X-MOTOR
dir_pin: PE10 # X-MOTOR
enable_pin: !PE9 # X-MOTOR
rotation_distance: 40
microsteps: 64
endstop_pin: PB14 # X-MIN
position_min: -3
position_endstop: 0
position_max: 405
homing_speed: 120
homing_retract_speed: 60
second_homing_speed: 30

[stepper_y]
step_pin: PD8 # Y-MOTOR
dir_pin: !PB12 # Y-MOTOR
enable_pin: !PD9 # Y-MOTOR
rotation_distance: 40
microsteps: 64
endstop_pin: PB13 # Y-MIN
position_min: -1
position_endstop: 0
position_max: 455
homing_speed: 120
homing_retract_speed: 60
second_homing_speed: 30

[stepper_z]
step_pin: PD14 # Z-MOTOR
dir_pin: !PD13 # Z-MOTOR
enable_pin: !PD15 # Z-MOTOR
microsteps: 64
rotation_distance: 8.0
position_min: -10
endstop_pin: probe:z_virtual_endstop
position_max: 700
homing_speed: 15
homing_retract_speed: 3
second_homing_speed: 3
homing_retract_dist: 5

[stepper_z1]
step_pin: PE6 # E1-MOTOR
dir_pin: !PC13 # E1-MOTOR
enable_pin: !PE5 # E1-MOTOR
microsteps: 64
rotation_distance: 8.0

[stepper_z2]
step_pin: PE2 # E2-MOTOR
dir_pin: PE4 # E3-MOTOR
enable_pin: !PE3 # E2-MOTOR
microsteps: 64
rotation_distance: 8

[stepper_z3]
step_pin: PD12 # E3-MOTOR
dir_pin: PC4 # E3-MOTOR
enable_pin: !PE8 # E3-MOTOR
microsteps: 64
rotation_distance: 8

########################################
# TMC UART/SPI configuration
########################################

[tmc2209 stepper_x]
uart_pin: PE7 # X-MOTOR
run_current: 1.200
stealthchop_threshold: 0
interpolate: False

[tmc2209 stepper_y]
uart_pin: PE15 # Y-MOTOR
run_current: 1.200
stealthchop_threshold: 0
interpolate: False

[tmc2209 stepper_z]
uart_pin: PD10 # Z-MOTOR
run_current: 1.200
stealthchop_threshold: 0
interpolate: False

[tmc2209 extruder]
uart_pin: PD7 # E0-MOTOR
run_current: 0.700 
stealthchop_threshold: 0
interpolate: False

[tmc2209 stepper_z1]
uart_pin: PC14 # E1-MOTOR
run_current: 1.200
stealthchop_threshold: 0
interpolate: False

[tmc2209 stepper_z2]
uart_pin: PC15 # E2-MOTOR
run_current: 1.200
stealthchop_threshold: 0
interpolate: False

[tmc2209 stepper_z3]
uart_pin: PA15 # E3-MOTOR
run_current: 1.200
stealthchop_threshold: 0
interpolate: False

[tmc2209 extruder_stepper _pulling_extruder]
uart_pin: PD11 # E4-MOTOR
run_current: 1.000
stealthchop_threshold: 0
interpolate: False
