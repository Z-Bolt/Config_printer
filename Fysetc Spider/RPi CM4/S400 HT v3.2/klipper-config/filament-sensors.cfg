########################################
# FILAMENT SENSOR configuration
########################################

[filament_switch_sensor Filament_Sensor]
pause_on_runout: false
runout_gcode:
	{% if printer.print_stats.state == "printing" %}
		{action_respond_info("Датчик филамента: филамент закончился")}
		PAUSE
		RESPOND TYPE=error MSG="Закончился филамент!"
		G92 E0
		G1 E30 F100
		G92 E0
		UNLOAD_FILAMENT
		{action_respond_info("Датчик филамента: филамент выгружен")}
		RESPOND PREFIX="[+]" MSG="Филамент выгружен, загрузите новый"
	{% endif %}
switch_pin: ^PA1 # X-MAX
