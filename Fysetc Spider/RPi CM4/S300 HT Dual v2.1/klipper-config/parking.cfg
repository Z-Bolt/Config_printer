
[gcode_macro CHECK_PARK0]
gcode:
   {% set svv = printer.save_variables.variables %}
   {% set Parking0State = printer['gcode_button t0_parking'].state %}
   {% set Parking1State = printer['gcode_button t1_parking'].state %}
   {% if (Parking0State == "PRESSED") and (Parking1State == "RELEASED") %} # T0 на каретке, T1 на парковке
   RESPOND PREFIX="[+]" MSG="T0 на каретке, продолжаем печать"
   {% else %}
      {% if svv.start_check == 1 %}
      RESPOND TYPE="error" MSG="WARNING PSAS-0721-0003. Проверьте положение печатных голов"
      PAUSE
      {% endif %}
   {% endif %}
   SAVE_VARIABLE VARIABLE=start_check VALUE=1

[gcode_macro CHECK_PARK1]
gcode:
   {% set svv = printer.save_variables.variables %}
   {% set Parking0State = printer['gcode_button t0_parking'].state %}
   {% set Parking1State = printer['gcode_button t1_parking'].state %}
   {% if (Parking0State == "RELEASED") and (Parking1State == "PRESSED") %} # T0 на парковке, T1 на каретке
   RESPOND PREFIX="[+]" MSG="T1 на каретке, продолжаем печать"
   {% else %}
      {% if svv.start_check == 1 %}
      RESPOND TYPE="error" MSG="WARNING PSAS-0722-0003. Проверьте положение печатных голов"
      PAUSE
      {% endif %}
   {% endif %}
   SAVE_VARIABLE VARIABLE=start_check VALUE=1

[gcode_macro _START_CHECK0]
gcode:
   SAVE_VARIABLE VARIABLE=start_check VALUE=0

[gcode_button t0_parking]
pin: ^!PA1 # Xmax
press_gcode: 
release_gcode: 

[gcode_button t1_parking]
pin: ^!PB13 # Ymin
press_gcode:
release_gcode: 

[gcode_macro parking_state]   
gcode:
   {% set svv = printer.save_variables.variables %}
   SAVE_VARIABLE VARIABLE=t0parking_state VALUE='"{printer['gcode_button t0_parking'].state}"'
   SAVE_VARIABLE VARIABLE=t1parking_state VALUE='"{printer['gcode_button t1_parking'].state}"'   
   RESPOND PREFIX="[+]" MSG="ActiveTool - {printer.toolhead.extruder} T0 {svv.t0parking_state} and T1 {svv.t1parking_state}"
