########################################
# FILAMENT SENSOR configuration
########################################

[filament_switch_sensor Tool0_Filament_Sensor]
pause_on_runout: False
runout_gcode:
   {% if printer.print_stats.state == "printing" %}
      PAUSE
      G92 E0
      G1 E40 F100
      RESPOND TYPE=error MSG="Проверьте филамент в левой голове!"
      G4 P2000
      G1 E-10 F100
      G1 E-20 F300
      G1 E-200 F1500
      G92 E0 
      RESPOND PREFIX="[+]" MSG="Филамент выгружен из левой головы, загрузите новый"
   {% endif %}
switch_pin: PC3 # T3

[filament_switch_sensor Tool1_Filament_Sensor]
pause_on_runout: False
runout_gcode:
   {% if printer.print_stats.state == "printing" %}
      PAUSE
      RESPOND TYPE=error MSG="Проверьте филамент в правой голове!"
      G4 P2000
      RESPOND PREFIX="[+]" MSG="Извлеките трубку из датчика филамента и вытяните филамент"
   {% endif %}
switch_pin: PB1 # T4

[gcode_macro _FILAMENT_CHECK0]
gcode:
	SAVE_VARIABLE VARIABLE=filament_check VALUE=0

[gcode_macro _FILAMENT_CHECK1]
gcode:
	SAVE_VARIABLE VARIABLE=filament_check VALUE=1

[delayed_gcode FS_delayed_gcode]
gcode:
	_FILAMENT_CHECK0
initial_duration: 1