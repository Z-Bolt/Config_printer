########################################
# FILAMENT SENSOR configuration
########################################

[filament_switch_sensor T0_FS]
pause_on_runout: False
runout_gcode:
    {% if printer.print_stats.state == "printing" %}
        _HANDLE_FILAMENT_RUNOUT CURRENT=0
    {% endif %}
switch_pin: PC3 # T3

[filament_switch_sensor T1_FS]
pause_on_runout: False
runout_gcode:
    {% if printer.print_stats.state == "printing" %}
        _HANDLE_FILAMENT_RUNOUT CURRENT=1
    {% endif %}
switch_pin: PB1 # T4

[gcode_macro CHANGE_INFINITY_PRINT]
description: Включает или отключает режим бесконечной печати. ENABLE=1 включает, ENABLE=0 отключает, без параметра переключает состояние.
gcode:
    {% set svv = printer.save_variables.variables %}
    {% set current_state = svv.infinity_print|default(False) %}
    {% if 'ENABLE' in params %}
        {% set new_state = params.ENABLE|int == 1 %}
    {% else %}
        {% set new_state = not current_state %}
    {% endif %}
    SAVE_VARIABLE VARIABLE=infinity_print VALUE={new_state}
    {% if new_state %}
        RESPOND PREFIX="[+]" MSG="Режим бесконечной печати включен"
    {% else %}
        RESPOND PREFIX="[+]" MSG="Режим бесконечной печати отключен"
    {% endif %}

[gcode_macro _HANDLE_FILAMENT_RUNOUT]
variable_busy: False
gcode:
    {% set svv = printer.save_variables.variables %}
    {% set current = params.CURRENT|int %}
    {% set other = 1 if current == 0 else 0 %}
    {% set infinity_enabled = svv.infinity_print|default(False) %}
    {% if other == 0 %}
        {% set other_has_filament = printer["filament_switch_sensor T0_FS"].filament_detected %}
    {% else %}
        {% set other_has_filament = printer["filament_switch_sensor T1_FS"].filament_detected %}
    {% endif %}
    {% if printer["gcode_macro _HANDLE_FILAMENT_RUNOUT"].busy %}
        RESPOND TYPE=error MSG="Смена филамента уже выполняется"
    {% elif infinity_enabled and other_has_filament %}
        SET_GCODE_VARIABLE MACRO=_HANDLE_FILAMENT_RUNOUT VARIABLE=busy VALUE=True
        _INFINITY_PRINT_RUNOUT CURRENT={current} OTHER={other}
        SET_GCODE_VARIABLE MACRO=_HANDLE_FILAMENT_RUNOUT VARIABLE=busy VALUE=False
    {% else %}
        _DEFAULT_FILAMENT_RUNOUT CURRENT={current}
    {% endif %}

[gcode_macro _DEFAULT_FILAMENT_RUNOUT]
gcode:
    {% set current = params.CURRENT|int %}
    {% if current == 0 %}
        PAUSE
        G92 E0
        G1 E40 F100
        RESPOND TYPE=error MSG="В левой голове (T0) закончился филамент!"
        G1 E-10 F100
        G1 E-20 F300
        G1 E-200 F1500
        G92 E0
        RESPOND PREFIX="[+]" MSG="Филамент выгружен из левой головы, загрузите новый"
    {% else %}
        PAUSE
        RESPOND TYPE=error MSG="В правой голове (T1) закончился филамент!"
        RESPOND PREFIX="[+]" MSG="Извлеките трубку из датчика филамента и выгрузите филамент"
    {% endif %}

[gcode_macro _INFINITY_PRINT_RUNOUT]
gcode:
    {% set svv = printer.save_variables.variables %}
    {% set current = params.CURRENT|int %}
    {% set other = params.OTHER|int %}
    {% set source_extruder = "extruder" if current == 0 else "extruder1" %}
    {% set source_target = printer[source_extruder].target|float %}
    {% set source_temp = printer[source_extruder].temperature|float %}
    {% set print_temp = source_target if source_target > 0 else source_temp %}
    {% set purge_length = svv.infinity_print_purge|default(100)|float %}
    {% set purge_speed = svv.infinity_print_purge_speed|default(300)|float %}
    PAUSE
    RESPOND PREFIX="[+]" MSG="Режим бесконечной печати: T{current} без филамента, переход на T{other}"
    T{current}
    UNLOAD_FILAMENT
    M104 T{other} S{print_temp}
    T{other}
    M109 T{other} S{print_temp}
    SAVE_GCODE_STATE NAME=infinity_print_prime
    G90
    M83
    G92 E0
    G1 E{purge_length} F{purge_speed}
    G92 E0
    RESTORE_GCODE_STATE NAME=infinity_print_prime
    RESPOND PREFIX="[+]" MSG="T{other} подготовлен, продолжаем печать"
    RESUME