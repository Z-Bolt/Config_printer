########################################
# HOMING configuration
########################################
# Восстановление состояния тулченджера при хоминге целиком в расширении:
# оно само читает датчики парковок, выбирает план восстановления и хомит Z
# только после того, как голова гарантированно на каретке.
# Прежняя «простыня» if/else (макросы HOMING и _CHECK_PARK_HOME) удалена.

[homing_override]
gcode:
  TOOLCHANGER_HOME
set_position_z: 0
