[heater_generic chamber]
gcode_id: chamber
heater_pin: PB3 # HEAT2
sensor_type: PT1000
sensor_pin: PC2 # T2
control: pid
pid_kp: 400
pid_ki: 0.3
pid_kd: 500
min_temp: 5
max_temp: 95

[verify_heater chamber]
max_error: 1200
check_gain_time: 2400
hysteresis: 10
heating_gain: 1

[temperature_sensor RPICM4]
sensor_type: temperature_host

[temperature_sensor MCU]
sensor_type: temperature_mcu
