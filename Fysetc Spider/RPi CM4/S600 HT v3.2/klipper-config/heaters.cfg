########################################
# HEATERS configuration
########################################
[extruder]
step_pin: PD5
dir_pin: !PD6
enable_pin: !PD4
microsteps: 16
rotation_distance: 5.68
nozzle_diameter: 0.600
filament_diameter: 1.750
heater_pin: PB15 # HE0
sensor_type: PT1000
sensor_pin: PC0
min_temp: 5
max_temp: 430
max_extrude_cross_section: 100
max_extrude_only_distance: 1000
pressure_advance: 0.03

[verify_heater extruder]
max_error: 240
check_gain_time: 60
hysteresis: 7
heating_gain: 2

[extruder_stepper _pulling_extruder]
extruder: extruder
step_pin: PC12
dir_pin: PD2
enable_pin: !PD1
microsteps: 16
rotation_distance: 23
pressure_advance: 0.03

[heater_bed]
heater_pin: PB4 # BED-OUT
sensor_type: temperature_combined
sensor_list: temperature_sensor _Bed_0, temperature_sensor _Bed_1
combination_method: mean
maximum_deviation: 20
control = pid
pid_kp = 66.402
pid_ki = 2.380
pid_kd = 463.152
min_temp: 0
max_temp: 145

[temperature_sensor _Bed_0]
sensor_type: PT1000
sensor_pin: PB0 # TB
min_temp: 5
max_temp: 145

[temperature_sensor _Bed_1]
sensor_type: PT1000
sensor_pin: PB1 # T4
min_temp: 5
max_temp: 145

[verify_heater heater_bed]
max_error: 300
check_gain_time: 600
hysteresis: 5
heating_gain: 2

[heater_generic chamber]
gcode_id: chamber
heater_pin: PB3 # E2
sensor_type: PT1000
sensor_pin: PC2 # T2
control: pid
pid_kp: 400
pid_ki: 0.3
pid_kd: 500
min_temp: 5
max_temp: 75

[verify_heater chamber]
max_error: 1200
check_gain_time: 2400
hysteresis: 10
heating_gain: 1

[temperature_sensor RPICM4]
sensor_type: temperature_host

[temperature_sensor MCU]
sensor_type: temperature_mcu
