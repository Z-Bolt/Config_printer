########################################
# HEATERS configuration
########################################
[extruder]
step_pin: PD5 # E0-MOTOR
dir_pin: !PD6 # E0-MOTOR
enable_pin: !PD4 # E0-MOTOR
microsteps: 16
rotation_distance: 5.68
nozzle_diameter: 0.600
filament_diameter: 1.750
heater_pin: PB15 # HEAT0
sensor_type: PT1000
sensor_pin: PC0 # T0
min_temp: 5
max_temp: 430
max_extrude_cross_section: 100
max_extrude_only_distance: 1000
pressure_advance: 0.03

[verify_heater extruder]
max_error: 240
check_gain_time: 60
hysteresis: 7
heating_gain: 2

[extruder_stepper _pulling_extruder]
extruder: extruder
step_pin: PE1 # E4-MOTOR
dir_pin: !PE0 # E4-MOTOR
enable_pin: !PC5 # E4-MOTOR
microsteps: 16
rotation_distance: 23
pressure_advance: 0.03

[multiplex_heater heater_bed]
gcode_id: B
min_temp: 0
max_temp: 145

[multiplex_heater_segment heater_bed0] # Левый половина
multiplex_heater: heater_bed
heater_pin: PB4 # BED-OUT
sensor_type: PT1000
sensor_pin: PB1 # T4
control: pid
pid_kp: 66.402
pid_ki: 2.380
pid_kd: 463.152
min_temp: 0
max_temp: 145

[verify_heater _heater_bed0]
max_error: 300
check_gain_time: 600
hysteresis: 5
heating_gain: 2

[multiplex_heater_segment heater_bed1] # Правая половина
multiplex_heater: heater_bed
heater_pin: PB3 # FAN5
sensor_type: PT1000
sensor_pin: PB0 # TB
control: pid
pid_kp: 66.402
pid_ki: 2.380
pid_kd: 463.152
min_temp: 0
max_temp: 145

[verify_heater _heater_bed1]
max_error: 300
check_gain_time: 600
hysteresis: 5
heating_gain: 2

