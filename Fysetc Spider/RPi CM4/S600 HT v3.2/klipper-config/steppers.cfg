########################################
# STEPPER configuration
########################################

[force_move]
enable_force_move: True  

[stepper_x]
step_pin: PE11 # X-MOTOR
dir_pin: !PE10 # X-MOTOR
enable_pin: !PE9 # X-MOTOR
rotation_distance: 48
microsteps: 64
endstop_pin: PB14 # X-MIN
position_min: -1 # MIN
position_endstop: 0
position_max: 601
homing_speed: 150
homing_retract_speed: 60
second_homing_speed: 30

[stepper_y]
step_pin: PD8 # Y-MOTOR
dir_pin: PB12 # Y-MOTOR
enable_pin: !PD9 # Y-MOTOR
rotation_distance: 48
microsteps: 64
endstop_pin: PB13 # Y-MIN
position_min: 0
position_endstop: 0
position_max: 610
homing_speed: 150
homing_retract_speed: 60
second_homing_speed: 30

[stepper_z]
step_pin: PD14 # Z-MOTOR
dir_pin: PD13 # Z-MOTOR
enable_pin: !PD15 # Z-MOTOR
microsteps: 64
rotation_distance: 8
position_min: -7
endstop_pin: probe:z_virtual_endstop
position_max: 901
homing_speed: 8
homing_retract_speed: 3
second_homing_speed: 2
homing_retract_dist: 5

[stepper_z1]
step_pin: PE6 # E1-MOTOR
dir_pin: PC13 # E1-MOTOR
enable_pin: !PE5 # E1-MOTOR
microsteps: 64
rotation_distance: 8

[stepper_z2]
step_pin: PE2 # E2-MOTOR
dir_pin: PE4 # E2-MOTOR
enable_pin: !PE3 # E2-MOTOR
microsteps: 64
rotation_distance: 8

[stepper_z3]
step_pin: PD12 # E3-MOTOR
dir_pin: PC4 # E3-MOTOR
enable_pin: !PE8 # E3-MOTOR
microsteps: 64
rotation_distance: 8
	
########################################
# TMC UART/SPI configuration
########################################

[tmc5160 stepper_x]
cs_pin: PE7 # X-MOTOR
spi_software_sclk_pin: PE12
spi_software_mosi_pin: PE14
spi_software_miso_pin: PE13
run_current: 1.400
interpolate: True
stealthchop_threshold: 0

[tmc5160 stepper_y]
cs_pin: PE15 # Y-MOTOR
spi_software_sclk_pin: PE12
spi_software_mosi_pin: PE14
spi_software_miso_pin: PE13
run_current: 1.400
stealthchop_threshold: 0

[tmc5160 stepper_z]
cs_pin: PD10 # Z-MOTOR
spi_software_sclk_pin: PE12
spi_software_mosi_pin: PE14
spi_software_miso_pin: PE13
run_current: 1.400
stealthchop_threshold: 0

[tmc2209 extruder]
uart_pin: PD7 # E0-MOTOR
run_current: 0.700
stealthchop_threshold: 0

[tmc5160 stepper_z1]
cs_pin: PC14 # E1-MOTOR
spi_software_sclk_pin: PE12
spi_software_mosi_pin: PE14
spi_software_miso_pin: PE13
run_current: 1.400
stealthchop_threshold: 0

[tmc5160 stepper_z2]
cs_pin: PC15 # E2-MOTOR
spi_software_sclk_pin: PE12
spi_software_mosi_pin: PE14
spi_software_miso_pin: PE13
run_current: 1.400
stealthchop_threshold: 0

[tmc5160 stepper_z3]
cs_pin: PA15 # E3-MOTOR
spi_software_sclk_pin: PE12
spi_software_mosi_pin: PE14
spi_software_miso_pin: PE13
run_current: 1.400
stealthchop_threshold: 0

[tmc2209 extruder_stepper _pulling_extruder]
uart_pin: PD11 # E4-MOTOR
run_current: 1.000
stealthchop_threshold: 0
interpolate: False
