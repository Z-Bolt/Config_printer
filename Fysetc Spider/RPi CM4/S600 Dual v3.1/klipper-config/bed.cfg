    PROBE
    _GZ0 ; macros - save probe result to Z0 variable
    G1 Z10 F1200
    G1 X10 Y590 F18000
    PROBE
    _GZ1 ; macros - save probe result to Z1 variable
    G1 Z10 F1200
    G1 X590 Y590 F18000
    PROBE
    _GZ2 ; macros - save probe result to Z2 variable
    G1 Z10 F1200
    G1 X590 Y10 F18000
    PROBE
    _GZ3 ; macros - save probe result to Z3 variable
    z_info
    G1 Z10 F1200
    G1 X310 Y310 F18000
    ;выравниваем плоскоть стола ...
    _quad_z_tilt_adjust
    ; 3 итерация
    G1 Z10 F1200
    G1 X10 Y10 F18000
    PROBE
    _GZ0 ; macros - save probe result to Z0 variable
    G1 Z10 F1200
    G1 X10 Y590 F18000
    PROBE
    _GZ1 ; macros - save probe result to Z1 variable
    G1 Z10 F1200
    G1 X590 Y590 F18000
    PROBE
    _GZ2 ; macros - save probe result to Z2 variable
    G1 Z10 F1200
    G1 X590 Y10 F18000
    PROBE
    _GZ3 ; macros - save probe result to Z3 variable
    z_info
    G1 Z10 F1200
    G1 X310 Y310 F18000
    ;выравниваем плоскоть стола ...
