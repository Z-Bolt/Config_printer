[heater_bed]
heater_pin: PB4
sensor_type: PT1000
sensor_pin: PB0
control = pid
pid_kp = 400
pid_ki = 0.3
pid_kd = 500
min_temp: 5
max_temp: 145

[verify_heater heater_bed]
max_error = 300
check_gain_time = 600
hysteresis = 5
heating_gain = 2

[heater_generic chamber]
gcode_id: chamber
heater_pin: PB3 # E2
sensor_type: PT1000
sensor_pin: PC2 # T2
control: pid
pid_kp = 400
pid_ki = 0.3
pid_kd = 500
min_temp: 5
max_temp: 70

[verify_heater chamber]
max_error: 1200
check_gain_time: 2400
hysteresis: 10
heating_gain: 1
