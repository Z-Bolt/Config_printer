########################################
# HEATERS configuration
########################################
[extruder]
step_pin: PD5
dir_pin: !PD6
enable_pin: !PD4
microsteps: 16
rotation_distance: 5.67
nozzle_diameter: 0.600
filament_diameter: 1.750
heater_pin: PB15 # HE0
#heater_pin: PC8 # HE1
sensor_type: PT1000
sensor_pin: PC0
control = pid
pid_kp = 23.008
pid_ki = 1.334
pid_kd = 99.222
min_temp: 5
max_temp: 430
max_extrude_cross_section: 100
max_extrude_only_distance: 1000
pressure_advance: 0.03

[verify_heater extruder]
max_error: 240
check_gain_time: 60
hysteresis: 7
heating_gain: 2

[extruder_stepper pulling_extruder]
extruder: extruder
step_pin: PC12
dir_pin: PD2
enable_pin: !PD1
microsteps: 16
rotation_distance: 23
pressure_advance: 0.03

