########################################
# STEPPER configuration
########################################
[force_move]
enable_force_move: True  

[stepper_x]
step_pin: PE11
dir_pin: PE10
enable_pin: !PE9
rotation_distance: 48
microsteps: 64
endstop_pin: PB14
position_min: -1
position_endstop: 0
position_max: 601
homing_speed: 150
homing_retract_speed: 60
second_homing_speed: 30

[stepper_y]
step_pin: PD8
dir_pin: !PB12
enable_pin: !PD9
rotation_distance: 48
microsteps: 64
endstop_pin: PB13
position_min: 0
position_endstop: 0
position_max: 610
homing_speed: 150
homing_retract_speed: 60
second_homing_speed: 30

[stepper_z]
step_pin: PD14
dir_pin: !PD13
enable_pin: !PD15
microsteps: 64
rotation_distance: 3
position_min: -3
endstop_pin: probe:z_virtual_endstop
position_max: 901
homing_speed: 8
homing_retract_speed: 3
second_homing_speed: 2
homing_retract_dist: 5

[stepper_z1]
step_pin: PE6
dir_pin: PC13
enable_pin: !PE5
microsteps: 64
rotation_distance: 3

[stepper_z2]
step_pin: PE2
dir_pin: !PE4
enable_pin: !PE3
microsteps: 64
rotation_distance: 3

[stepper_z3]
step_pin: PD12
dir_pin: !PC4
enable_pin: !PE8
microsteps: 64
rotation_distance: 3
  
########################################
# TMC UART configuration
########################################

[tmc5160 stepper_x]
cs_pin: PE7
spi_software_sclk_pin: PE12
spi_software_mosi_pin: PE14
spi_software_miso_pin: PE13
run_current: 1.400
interpolate: True
stealthchop_threshold: 0

[tmc5160 stepper_y]
cs_pin: PE15
spi_software_sclk_pin: PE12
spi_software_mosi_pin: PE14
spi_software_miso_pin: PE13
run_current: 1.400
stealthchop_threshold: 0

[tmc5160 stepper_z]
cs_pin: PD10
spi_software_sclk_pin: PE12
spi_software_mosi_pin: PE14
spi_software_miso_pin: PE13
run_current: 1.400
stealthchop_threshold: 0

[tmc5160 stepper_z1]
cs_pin: PC14
spi_software_sclk_pin: PE12
spi_software_mosi_pin: PE14
spi_software_miso_pin: PE13
run_current: 1.400
stealthchop_threshold: 0

[tmc5160 stepper_z2]
cs_pin: PC15
spi_software_sclk_pin: PE12
spi_software_mosi_pin: PE14
spi_software_miso_pin: PE13
run_current: 1.400
stealthchop_threshold: 0

[tmc5160 stepper_z3]
cs_pin: PA15
spi_software_sclk_pin: PE12
spi_software_mosi_pin: PE14
spi_software_miso_pin: PE13
run_current: 1.400
stealthchop_threshold: 0

[tmc2209 extruder]
uart_pin: PD7
run_current: 0.700 # motor g36hsy4405 1A
stealthchop_threshold: 0

[tmc2209 extruder_stepper pulling_extruder]
uart_pin: PD11
run_current: 0.950 
hold_current: 0.700
stealthchop_threshold: 0
interpolate: False
