########################################
# BED LEVEL configuration
########################################

[probe]
pin: PA0 # Z-MIN
x_offset: 0.0
y_offset: 0.0
z_offset: -1.00
speed: 3
lift_speed: 25
samples: 1
sample_retract_dist: 2.0
samples_result: average
samples_tolerance: 0.04
samples_tolerance_retries: 0

[bed_mesh]
speed: 400
horizontal_move_z: 2
mesh_min: 20,20
mesh_max: 280,280
probe_count: 9,9
algorithm: bicubic
bicubic_tension: 0.1
# compensation_amplitude: 0.1
# x_coordinate_min: 0
# x_coordinate_max: 300

[gcode_macro G29]
description: Автокалибровка карты неровностей стола.
gcode:
	{% if "xy" not in printer.toolhead.homed_axes %}
		G28 X Y
	{% endif %}
	{% if "z" not in printer.toolhead.homed_axes %}
		G28 Z
	{% endif %}
	BED_MESH_CALIBRATE

[safe_z_home]
home_xy_position: 150,150
speed: 400
z_hop: 3
z_hop_speed: 15
move_to_previous: True

[z_tilt]
z_positions:
	-50,150
	350,150
points:
	10,150
	290,150
speed: 400
horizontal_move_z: 3
retries: 5
retry_tolerance: 0.04

[gcode_macro G34]
description: Автокалибровка стола. Выравнивание горизонта стола.
gcode:
	{% if "xy" not in printer.toolhead.homed_axes %}
		G28 X Y
	{% endif %}
	{% if "z" not in printer.toolhead.homed_axes %}
		G28 Z
	{% endif %}
	Z_TILT_ADJUST

[gcode_macro _SAVE_Z_OFFSET]
gcode:
	{% set svv = printer.save_variables.variables %}
	{% set new_z = printer.gcode_move.homing_origin.z | float | round(3) %}
	SAVE_VARIABLE VARIABLE=offset_z VALUE={new_z}

[delayed_gcode _APPLY_Z_OFFSET]
gcode:
	{% set svv = printer.save_variables.variables %}
	{% set offset_z = svv.offset_z | round(3) %}
	SET_GCODE_OFFSET Z={offset_z}
	{% if offset_z > 0 %}
		RESPOND PREFIX="[Z]" MSG="Применен z-офсет: {offset_z}"
	{% endif %}
initial_duration: 0.5

[axis_twist_compensation]
speed: 400
horizontal_move_z: 2
calibrate_start_x: 10
calibrate_end_x: 290
calibrate_y: 150
calibrate_start_y: 10
calibrate_end_y: 290
calibrate_x: 150