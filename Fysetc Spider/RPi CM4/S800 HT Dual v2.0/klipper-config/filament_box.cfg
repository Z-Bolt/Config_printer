[mcu expander]
serial: /dev/serial/by-path/platform-fe9c0000.xhci-usb-0:1.4:1.0

[heater_generic filament_box]
gcode_id: filament_box
heater_pin: expander:PA0 # expander M0
sensor_type: PT1000
sensor_pin: expander:PA6 # expander T0
control: pid
pid_Kp: 36 
pid_Ki: 1 
pid_Kd: 305
min_temp: 0
max_temp: 85

[verify_heater filament_box]
max_error: 300
check_gain_time: 600
hysteresis: 5
heating_gain: 2

[heater_fan _filament_box_fan]
pin: expander:PA1 # expander M1
heater: filament_box

[gcode_macro FILAMENT_DRYING]
description: Макрос сушки филамента в отсеке филамента. Перед использованием закройте двери!
gcode:
    {% set svv = printer.save_variables.variables %}
    {% set T_TARGET = params.T_TARGET | default(70) | int %}
    {% set TIME = params.TIME | default(8) | float * 3600000 %}
    {% set IDLE_TIMEOUT = printer.configfile.config.idle_timeout.timeout | default(86400) | int * 1000 %}
    {% set max_filament_box_temp = printer.configfile.settings['heater_generic filament_box'].max_temp %}
    RESPOND PREFIX="[+]" MSG="Включаем нагрев отсека филамента до установленной температуры"
    {% if T_TARGET < ( max_filament_box_temp - 5 ) %}
        SET_HEATER_TEMPERATURE HEATER=filament_box TARGET={T_TARGET}
    {% else %}
        SET_HEATER_TEMPERATURE HEATER=filament_box TARGET={max_filament_box_temp - 5}
    {% endif %}
    SET_HEATER_TEMPERATURE HEATER=heater_bed TARGET={T_TARGET}
    RESPOND PREFIX="[+]" MSG="Время сушки {TIME / 3600000} ч"
    {% if TIME > IDLE_TIMEOUT %}
        RESPOND PREFIX="[+]" MSG="Время сушки превышает предел бездействия принтера. Установлен новый предел"
        SET_IDLE_TIMEOUT TIMEOUT={TIME}
    {% endif %}
    G4 P{TIME}
    RESPOND PREFIX="[+]" MSG="Сушка окончена. Нагреватели выключены"
    TURN_OFF_HEATERS
    {% if svv.change_poweroff %}
        RESPOND PREFIX="[+]" MSG="Принтер выключается"
        M81
    {% else %}
        FIRMWARE_RESTART
    {% endif %}