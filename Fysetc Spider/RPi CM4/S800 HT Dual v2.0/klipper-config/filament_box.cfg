[heater_generic filament_box]
gcode_id: filament_box
heater_pin: PB7 # FAN5 
sensor_type: PT1000
sensor_pin: PC2 # T2
control: pid
pid_Kp: 36 
pid_Ki: 1 
pid_Kd: 305
min_temp: 0
max_temp: 85

[verify_heater filament_box]
max_error: 300
check_gain_time: 600
hysteresis: 5
heating_gain: 2

[heater_fan _filament_box_fan]
pin: PB6 # FAN4
heater: filament_box

[gcode_macro FILAMENT_DRYING]
description: Макрос сушки филамента в отсеке филамента. Перед использованием закройте двери!
gcode:
	{% set svv = printer.save_variables.variables %}
	{% set T_TARGET = params.T_TARGET | default(70) | int %}
	{% set TIME = params.TIME | default(8) | float * 3600000 %}
	{% set IDLE_TIMEOUT = printer.configfile.config.idle_timeout.timeout | default(86400) | int * 1000 %}
	{% set max_filament_box_temp = printer.configfile.settings['heater_generic filament_box'].max_temp %}
	RESPOND PREFIX="[+]" MSG="Включаем нагрев отсека филамента до установленной температуры"
	{% if T_TARGET < ( max_filament_box_temp - 5 ) %}
		SET_HEATER_TEMPERATURE HEATER=filament_box TARGET={T_TARGET}
	{% else %}
		SET_HEATER_TEMPERATURE HEATER=filament_box TARGET={max_filament_box_temp - 5}
	{% endif %}
	SET_HEATER_TEMPERATURE HEATER=heater_bed TARGET={T_TARGET}
	RESPOND PREFIX="[+]" MSG="Время сушки {TIME / 3600000} ч"
	{% if TIME > IDLE_TIMEOUT %}
		RESPOND PREFIX="[+]" MSG="Время сушки превышает предел бездействия принтера. Установлен новый предел"
		SET_IDLE_TIMEOUT TIMEOUT={TIME}
	{% endif %}
	G4 P{TIME}
	RESPOND PREFIX="[+]" MSG="Сушка окончена. Нагреватели выключены"
	TURN_OFF_HEATERS
	{% if svv.change_poweroff %}
		RESPOND PREFIX="[+]" MSG="Принтер выключается"
		M81
	{% else %}
		FIRMWARE_RESTART
	{% endif %}

########################################
# FILAMENT SENSOR configuration
########################################

[filament_switch_sensor T0_FS]
pause_on_runout: False
runout_gcode:
	{% if printer.print_stats.state == "printing" %}
		_HANDLE_FILAMENT_RUNOUT CURRENT=0
	{% endif %}
switch_pin: expander:PB0

[filament_switch_sensor T1_FS]
pause_on_runout: False
runout_gcode:
	{% if printer.print_stats.state == "printing" %}
		_HANDLE_FILAMENT_RUNOUT CURRENT=1
	{% endif %}
switch_pin: expander:PB1

[gcode_macro CHANGE_INFINITY_PRINT]
description: Включает или отключает режим бесконечной печати. ENABLE=1 включает, ENABLE=0 отключает, без параметра переключает состояние.
gcode:
	{% set svv = printer.save_variables.variables %}
	{% set current_state = svv.infinity_print|default(False) %}
	{% if 'ENABLE' in params %}
		{% set new_state = params.ENABLE|int == 1 %}
	{% else %}
		{% set new_state = not current_state %}
	{% endif %}
	SAVE_VARIABLE VARIABLE=infinity_print VALUE={new_state}
	{% if new_state %}
		RESPOND PREFIX="[+]" MSG="Режим бесконечной печати включен"
	{% else %}
		RESPOND PREFIX="[+]" MSG="Режим бесконечной печати отключен"
	{% endif %}

[gcode_macro _HANDLE_FILAMENT_RUNOUT]
variable_busy: False
gcode:
	{% set svv = printer.save_variables.variables %}
	{% set current = params.CURRENT|int %}
	{% set other = 1 if current == 0 else 0 %}
	{% set infinity_enabled = svv.infinity_print|default(False) %}
	{% if other == 0 %}
		{% set other_has_filament = printer["filament_switch_sensor T0_FS"].filament_detected %}
	{% else %}
		{% set other_has_filament = printer["filament_switch_sensor T1_FS"].filament_detected %}
	{% endif %}
	{% if printer["gcode_macro _HANDLE_FILAMENT_RUNOUT"].busy %}
		RESPOND TYPE=error MSG="Смена филамента уже выполняется"
	{% elif infinity_enabled and other_has_filament %}
		SET_GCODE_VARIABLE MACRO=_HANDLE_FILAMENT_RUNOUT VARIABLE=busy VALUE=True
		_INFINITY_PRINT_RUNOUT CURRENT={current} OTHER={other}
		SET_GCODE_VARIABLE MACRO=_HANDLE_FILAMENT_RUNOUT VARIABLE=busy VALUE=False
	{% else %}
		_DEFAULT_FILAMENT_RUNOUT CURRENT={current}
	{% endif %}

[gcode_macro _DEFAULT_FILAMENT_RUNOUT]
gcode:
	{% set svv = printer.save_variables.variables %}
	{% set current = params.CURRENT|int %}
	{% if current == 0 %}
		{% set tool_error = "левой голове (T0)" %}
		{% set tool_unload = "левой головы (T0)" %}
	{% else %}
		{% set tool_error = "правой голове (T1)" %}
		{% set tool_unload = "правой головы (T1)" %}
	{% endif %}
	PAUSE
	RESPOND TYPE=error MSG="В {tool_error} закончился филамент!"
	G4 P2000
	T{current}
	G92 E0
	G1 E30 F100
	G92 E0
	UNLOAD_FILAMENT
	RESPOND PREFIX="[+]" MSG="Филамент из {tool_unload} выгружен, загрузите новый"

[gcode_macro _INFINITY_PRINT_RUNOUT]
gcode:
	{% set svv = printer.save_variables.variables %}
	{% set current = params.CURRENT|int %}
	{% set other = params.OTHER|int %}
	{% set source_extruder = "extruder" if current == 0 else "extruder1" %}
	{% set source_target = printer[source_extruder].target|float %}
	{% set source_temp = printer[source_extruder].temperature|float %}
	{% set print_temp = source_target if source_target > 0 else source_temp %}
	{% set purge_length = svv.infinity_print_purge|default(100)|float %}
	{% set purge_speed = svv.infinity_print_purge_speed|default(300)|float %}
	PAUSE
	RESPOND PREFIX="[+]" MSG="Режим бесконечной печати: T{current} без филамента, переход на T{other}"
	G4 P2000
	T{current}
	UNLOAD_FILAMENT
	M104 T{other} S{print_temp}
	T{other}
	M109 T{other} S{print_temp}
	SAVE_GCODE_STATE NAME=infinity_print_prime
	G90
	M83
	G92 E0
	G1 E{purge_length} F{purge_speed}
	G92 E0
	RESTORE_GCODE_STATE NAME=infinity_print_prime
	RESPOND PREFIX="[+]" MSG="T{other} подготовлен, продолжаем печать"
	RESUME
