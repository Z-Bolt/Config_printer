########################################
# STEPPER configuration
########################################
[force_move]
enable_force_move: True  

[stepper_x]
step_pin: PE11 # X-MOTOR
dir_pin: PE10 # X-MOTOR
enable_pin: !PE9 # X-MOTOR
rotation_distance: 48
microsteps: 64
endstop_pin: PB14 #X-MIN
position_min: -51
position_endstop: -50
position_max: 805
homing_speed: 90
homing_retract_speed: 60
second_homing_speed: 30

[stepper_y]
step_pin: PD8 # Y-MOTOR
dir_pin: !PB12 # Y-MOTOR
enable_pin: !PD9 # Y-MOTOR
rotation_distance: 48
microsteps: 64
endstop_pin: PA2 # Y-MAX
position_min: -1
position_endstop: 800
position_max: 801
homing_speed: 90
homing_retract_speed: 60
second_homing_speed: 30

[stepper_z]
step_pin: PD14 # Z-MOTOR
dir_pin: !PD13 # Z-MOTOR
enable_pin: !PD15 # Z-MOTOR
microsteps: 64
rotation_distance: 3.009
position_min: -3
position_max: 801
homing_speed: 8
homing_retract_speed: 3
second_homing_speed: 2

[stepper_z1]
step_pin: PE6 # E1-MOTOR
dir_pin: !PC13 # E1-MOTOR
enable_pin: !PE5 # E1-MOTOR
microsteps: 64
rotation_distance: 3.009

[stepper_z2]
step_pin: PE2 # E2-MOTOR
dir_pin: !PE4 # E2-MOTOR
enable_pin: !PE3 # E2-MOTOR
microsteps: 64
rotation_distance: 3.009

[stepper_z3]
step_pin: PD12 # E3-MOTOR
dir_pin: !PC4 # E3-MOTOR
enable_pin: !PE8 # E3-MOTOR
microsteps: 64
rotation_distance: 3.009

[gcode_macro Z_MAX]
gcode:
  G90
  {% set z_max = printer.toolhead.axis_maximum.z|float - 5 %}
  G1 Z{z_max} F900

[gcode_macro UNSAFE_LOWER_BED]
description = Lower the bed 10mm without homing
gcode = 
	G90
	SET_KINEMATIC_POSITION Z=0
	G0 Z10 F600
	M84

########################################
# TMC UART configuration
########################################
[tmc5160 stepper_x]
cs_pin: PE7
spi_software_sclk_pin: PE12
spi_software_mosi_pin: PE14
spi_software_miso_pin: PE13
run_current: 2.400
sense_resistor: 0.033
stealthchop_threshold: 0

[tmc5160 stepper_y]
cs_pin: PE15
spi_software_sclk_pin: PE12
spi_software_mosi_pin: PE14
spi_software_miso_pin: PE13
run_current: 2.400
sense_resistor: 0.033
stealthchop_threshold: 0

[tmc5160 stepper_z]
cs_pin: PD10
spi_software_sclk_pin: PE12
spi_software_mosi_pin: PE14
spi_software_miso_pin: PE13
run_current: 2.000
sense_resistor: 0.033
stealthchop_threshold: 0

[tmc5160 stepper_z1]
cs_pin: PC14
spi_software_sclk_pin: PE12
spi_software_mosi_pin: PE14
spi_software_miso_pin: PE13
run_current: 2.000
sense_resistor: 0.033
stealthchop_threshold: 0

[tmc5160 stepper_z2]
cs_pin: PC15
spi_software_sclk_pin: PE12
spi_software_mosi_pin: PE14
spi_software_miso_pin: PE13
run_current: 2.000
sense_resistor: 0.033
stealthchop_threshold: 0

[tmc5160 stepper_z3]
cs_pin: PA15
spi_software_sclk_pin: PE12
spi_software_mosi_pin: PE14
spi_software_miso_pin: PE13
run_current: 2.000
sense_resistor: 0.033
stealthchop_threshold: 0

[tmc2209 extruder]
uart_pin: PD7 # E1-MOTOR
run_current: 0.700 # motor g36hsy4405 1A
stealthchop_threshold: 0

[tmc2209 extruder1]
uart_pin: PD11 # E4-MOTOR
run_current: 0.700 # motor g36hsy4405 1A
stealthchop_threshold: 0
