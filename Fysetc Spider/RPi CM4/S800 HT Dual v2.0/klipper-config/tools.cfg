[servo TCHS]
pin: expander:PA1 #TOP_SPIDER X-MAX
maximum_servo_angle: 180
minimum_pulse_width: 0.0005
maximum_pulse_width: 0.0025
# initial_angle: 105 #save value 90

[servo VLVE]
pin: expander:PA2 #TOP_SPIDER Y-MAX
maximum_servo_angle: 180
minimum_pulse_width: 0.0005
maximum_pulse_width: 0.0025
# initial_angle: 90 #save value 90 #don't use

[gcode_macro T0]
gcode:
	{% set svv = printer.save_variables.variables %}
	{% set z_off = svv.offset_z|default(0)|float %}
	{% set current_z = printer.gcode_move.homing_origin.z|float %}
	{% if printer.toolhead.extruder == 'extruder1' %}
		{% set stored_z = (svv.t1_z_offset|float + z_off) %}
	{% else %}
		{% set stored_z = (svv.t0offset|float + z_off) %}
	{% endif %}
	{% set delta_z = (current_z - stored_z)|round(5) %}
	{% if delta_z|abs > 0.0001 %}
		{% set new_z_offset = (z_off + delta_z)|round(5) %}
		SAVE_VARIABLE VARIABLE=offset_z VALUE={new_z_offset}
	{% endif %}
	SET_SERVO servo=TCHS angle=70 # lift left PH
	G4 P500
		SET_SERVO servo=VLVE angle=90 #set vavle to save position
	G4 P600
	SET_SERVO servo=TCHS angle=110 # lift right PH
	G4 P600
	SET_SERVO servo=VLVE angle=45 # set valve below right nozzle
	G4 P500
	SET_SERVO servo=TCHS angle=100 # close the right nozzle
	ACTIVATE_EXTRUDER EXTRUDER=extruder
	{% set z_off = svv.offset_z|default(0)|float %}
	{% set t0_z = svv.t0offset|float + z_off %}
	_SET_GCODE_OFFSET_INTERNAL X=0 Y=0 Z={t0_z}
	RESTORE_SPEED_FACTOR

[gcode_macro T1]
gcode:
	{% set svv = printer.save_variables.variables %}
	{% set z_off = svv.offset_z|default(0)|float %}
	{% set current_z = printer.gcode_move.homing_origin.z|float %}
	{% if printer.toolhead.extruder == 'extruder1' %}
		{% set stored_z = (svv.t1_z_offset|float + z_off) %}
	{% else %}
		{% set stored_z = (svv.t0offset|float + z_off) %}
	{% endif %}
	{% set delta_z = (current_z - stored_z)|round(5) %}
	{% if delta_z|abs > 0.0001 %}
		{% set new_z_offset = (z_off + delta_z)|round(5) %}
		SAVE_VARIABLE VARIABLE=offset_z VALUE={new_z_offset}
	{% endif %}
	SET_SERVO servo=TCHS angle=110 # lift right PH
	G4 P500
	SET_SERVO servo=VLVE angle=90 # set valve to save position
	G4 P600
	SET_SERVO servo=TCHS angle=70 # lift left PH
	G4 P600
	SET_SERVO servo=VLVE angle=142 # set valve below left nozzle
	G4 P500
	SET_SERVO servo=TCHS angle=80 # close the left nozzle
	ACTIVATE_EXTRUDER EXTRUDER=extruder1
	{% set z_off = svv.offset_z|default(0)|float %}
	{% set t1_z = svv.t1_z_offset|float + z_off %}
	_SET_GCODE_OFFSET_INTERNAL X={svv.t1_x_offset} Y={svv.t1_y_offset} Z={t1_z}
	RESTORE_SPEED_FACTOR

########################################
# ПАРКОВКА ГОЛОВ НА S800 НЕ ИСПОЛЬЗУЕТСЯ
########################################
# Обе головы постоянно находятся на каретке, смена инструмента выполняется только
# сервоприводами TCHS (подъём неактивной головы) и VLVE (клапан под её соплом).
# Ооз неактивной головы отсекает клапан, поэтому парковочные макросы
# (_PARK_EXTRUDER / _PARK_EXTRUDER0 / _PARK_EXTRUDER1 / _GET_EXTRUDER*) и проверки
# парковок (_START_CHECK0 / CHECK_PARK0 / CHECK_PARK1), применяемые в тулченджерных
# Dual (S300/S310/S400/S600), здесь отсутствуют — вместе с переменными
# t0x_park / t0y_park / t1x_park / t1y_park, которых больше нет в variables.cfg.

