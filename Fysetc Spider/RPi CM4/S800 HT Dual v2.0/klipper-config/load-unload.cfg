[gcode_macro LOAD_FILAMENT]
description: Макрос загрузки филамента. Вставьте пруток в трубку и протолкните его до экструдера. Отогните прижимную лапку экструдера и просуньте филамент до шестерен. Далее выполнине данный макрос. 
gcode:
  {% set ActiveTool = printer.toolhead.extruder %}
  {% set svv = printer.save_variables.variables %}
  {% if ActiveTool == "extruder" %} # Active tool - tool0
    {% set tool_nr = 0 %}
  {% else %}                        # Active tool - tool1
    {% set tool_nr = 1 %}
  {% endif %} 
  {% if "xyz" not in printer.toolhead.homed_axes %}
   G28
  {% endif %}
  T{tool_nr}
  SAVE_GCODE_STATE NAME=load
  {% set cur_temp = printer[printer.toolhead.extruder].temperature|float %}
  {% set target_temp = printer[printer.toolhead.extruder].target|float %}
  {% if cur_temp < target_temp %}
      {% set wait_temp = target_temp %}
  {% else %}
      {% set wait_temp = cur_temp %}
  {% endif %}
  {% if wait_temp < 210 %}
      {% set wait_temp = 210 %}
  {% else %}
  {% endif %}
  M104 S{wait_temp}
  G1 X10 Y10 F12000
  TEMPERATURE_WAIT SENSOR={printer.toolhead.extruder} MINIMUM={wait_temp}
  M82
  G92 E0
  {% if ActiveTool == "extruder" %} # Active tool - tool0
    FORCE_MOVE STEPPER="extruder_stepper _pulling_extruder" DISTANCE=1950 VELOCITY=100 ACCEL=30
  {% else %}                        # Active tool - tool1
    FORCE_MOVE STEPPER="extruder_stepper _pulling_extruder1" DISTANCE=1950 VELOCITY=100 ACCEL=30
  {% endif %} 
  G1 E20 F600
  G1 E95 F900
  G1 E100 F150
  G92 E0
  RESTORE_GCODE_STATE NAME=load

[gcode_macro UNLOAD_FILAMENT]
description: Макрос выгрузки филамента. Выполните данный макрос. Далее извлеките прутик из трубки.
gcode:
  {% set ActiveTool = printer.toolhead.extruder %}
  {% set svv = printer.save_variables.variables %}
  {% if ActiveTool == "extruder" %} # Active tool - tool0
    {% set tool_nr = 0 %}
  {% else %}                        # Active tool - tool1
    {% set tool_nr = 1 %}
  {% endif %} 
  {% if "xyz" not in printer.toolhead.homed_axes %}
   G28
  {% endif %}
  T{tool_nr}
  SAVE_GCODE_STATE NAME=unload
  {% set cur_temp = printer[printer.toolhead.extruder].temperature|float %}
  {% set target_temp = printer[printer.toolhead.extruder].target|float %}
  {% if cur_temp < target_temp %}
      {% set wait_temp = target_temp %}
  {% else %}
      {% set wait_temp = cur_temp %}
  {% endif %}
  {% if wait_temp < 210 %}
      {% set wait_temp = 210 %}
  {% else %}
  {% endif %}
  M104 S{wait_temp}
  G1 X10 Y10 F12000
  TEMPERATURE_WAIT SENSOR={printer.toolhead.extruder} MINIMUM={wait_temp}
  M82
  G92 E0
  G1 E10 F200
  G1 E-10 F900
  G1 E-30 F300
  G1 E-130 F900
  {% if ActiveTool == "extruder" %} # Active tool - tool0
    FORCE_MOVE STEPPER="extruder_stepper _pulling_extruder" DISTANCE=-1950 VELOCITY=50 ACCEL=30
  {% else %}                        # Active tool - tool1
    FORCE_MOVE STEPPER="extruder_stepper _pulling_extruder1" DISTANCE=-1950 VELOCITY=50 ACCEL=30
  {% endif %}
  G92 E0  
  RESTORE_GCODE_STATE NAME=unload
