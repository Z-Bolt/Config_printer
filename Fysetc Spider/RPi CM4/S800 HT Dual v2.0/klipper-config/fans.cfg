########################################
# FANS configuration
########################################

[multi_pin part_fan]
pins: PA14, PB5  # FAN1, FAN3

[fan]
pin: multi_pin:part_fan

[heater_fan _extruder]
pin: PA13 # FAN0
heater: extruder
heater_temp: 60.0
fan_speed: 1.0

[heater_fan _extruder1]
pin: PB2 # FAN2
heater: extruder1
heater_temp: 60.0
fan_speed: 1.0

[heater_fan _chamber]
pin: PA3 # Z-MAX
heater: chamber
heater_temp: 60
fan_speed: 1.0
shutdown_speed: 1

[fan_generic Chamber_fan]
pin: expander:PA14

[output_pin _motors_fan]
pin: expander:PA13 # FAN0
value: 1
shutdown_value: 1

[gcode_macro M106]
rename_existing: M106.1
gcode:
	{% set fan = 'fan' + (params.P|int if params.P is defined else 0)|string %}
	{% set speed = (params.S|float / 255 if params.S is defined else 1.0) %}
	{% if fan == 'fan3' %}
		SET_FAN_SPEED FAN=Chamber_fan SPEED={speed}
	{% endif %}
	{% if params.S is defined and fan == 'fan0' %}
		{% set speed = params.S|string %}
		M106.1 S{speed}
	{% endif %}

