[gcode_macro START_PRINT]
description: Макрос начала печати.
gcode:
	{% set svv = printer.save_variables.variables %}
	{% set T_BED = params.T_BED | default(90) | float %}
	{% set T_EXTRUDER = params.T_EXTRUDER | default(230) | float %}
	{% set T_CHAMBER = params.T_CHAMBER | default(0) | float %}
	{% set TOOL_NR = params.TOOL_NR | default(0) | int %}
	{% set T0_TEMP = params.T0_TEMP | default(0) | int %}
	{% set T1_TEMP = params.T1_TEMP | default(0) | int %}
	{% set T_CALIBRATE = svv.t_calibrate | default(160) | float %}
	{% set T_STAB = svv.t_stab %}
	_STATUS_RECORD
	G4 P2000
	RESPOND PREFIX="[+]" MSG="Подготовка к печати"
	G21
	G90
	M82
	M107
	G28
	RESPOND PREFIX="[+]" MSG="Включен нагрев стола до рабочей температуры"
	M140 S{T_BED}
	RESPOND PREFIX="[+]" MSG="Включен нагрев хотенда до температуры калибровки"
	M104 S{T_CALIBRATE}
	{% if T_CHAMBER != 0 %} 
		RESPOND PREFIX="[+]" MSG="Включен нагрев камеры до заданной температуры"
		SET_HEATER_TEMPERATURE HEATER=chamber TARGET={T_CHAMBER}
	{% endif %}
	{% if printer.heater_bed.temperature <= T_BED %}
		TEMPERATURE_WAIT SENSOR=heater_bed MINIMUM={T_BED}
	{% else %}
		TEMPERATURE_WAIT SENSOR=heater_bed MAXIMUM={T_BED}
	{% endif %}
	{% if printer.extruder.temperature <= T_CALIBRATE %}
		TEMPERATURE_WAIT SENSOR=extruder MINIMUM={T_CALIBRATE}
	{% else %}
		TEMPERATURE_WAIT SENSOR=extruder MAXIMUM={T_CALIBRATE}
	{% endif %}
	{% if T_STAB %}
		{% if T_CHAMBER <= 70 %}
			RESPOND PREFIX="[+]" MSG="Термостабилизация - 3 минуты"
			G4 P180000
		{% elif T_CHAMBER > 70 %}
			RESPOND PREFIX="[+]" MSG="Термостабилизация - 6 минут"
			G4 P360000
		{% endif %}
		RESPOND PREFIX="[+]" MSG="Термостабилизация завершена"
	{% endif %}
	G1 Z10 F900
	RESPOND PREFIX="[+]" MSG="Выравнивание горизонта стола"
	QUAD_GANTRY_LEVEL
	RESPOND PREFIX="[+]" MSG="Снятие карты неровностей"
	BED_MESH_CALIBRATE ADAPTIVE=1
	G1 Z10 F1200
	G1 X10 Y10 F18000
	M104 S0
	RESPOND PREFIX="[+]" MSG="Выбор головы T{TOOL_NR} для печати"
	T{TOOL_NR}
	G1 Z0
	RESPOND PREFIX="[+]" MSG="Включен нагрев хотенда до заданной температуры"
	M104 T0 S{T0_TEMP}
	M104 T1 S{T1_TEMP}
	TEMPERATURE_WAIT SENSOR={printer.toolhead.extruder} MINIMUM={T_EXTRUDER}
	{% if T_CHAMBER != 0 %} 
		RESPOND PREFIX="[+]" MSG="Ожидание нагрева камеры до установленной температуры"
		TEMPERATURE_WAIT SENSOR=chamber MINIMUM={T_CHAMBER}
	{% endif %}
	RESPOND PREFIX="[+]" MSG="Печать линии прочистки сопла"
	INTRO_LINE
	BUZZER_START
	RESPOND PREFIX="[+]" MSG="Начало печати"
	_START_RECORD

[gcode_macro INTRO_LINE]
description: Печать линии прочистки сопла.
description:
gcode:
	G1 X20 Y0 F5000
	G1 Z0.2 F2000
	G1 X70 E10 F1500
	G1 X120 E18 F1000
	G92 E0

[gcode_macro END_PRINT]
description: Макрос окончания печати.
gcode:
	{% set svv = printer.save_variables.variables %}
	{% set T_CHAMBER = params.T_CHAMBER | default(0) | float %}
	{% set T_BED = params.T_BED | default(100) | float %}
	{% set COOLDOWN_TIME = params.COOLDOWN_TIME | default(120) | float %}
	{% set SHUTDOWN_TEMP = params.SHUTDOWN_TEMP | default(60) | float %}
	{% if T_CHAMBER >= 40 %}
		SAVE_VARIABLE VARIABLE=target_chamb VALUE={T_CHAMBER}
	{% else %}
		SAVE_VARIABLE VARIABLE=target_chamb VALUE=0
	{% endif %}
	SAVE_VARIABLE VARIABLE=target_bed VALUE={T_BED} 
	SAVE_VARIABLE VARIABLE=cooldown_time VALUE={COOLDOWN_TIME}
	{% set max_z = printer.toolhead.axis_maximum.z|float - 10 %}
	{% set act_z = printer.toolhead.position.z|float %}
	{% set z_safe = act_z + 10 %}
	_END_RECORD
	G91
	G1 E-2 F2000
	G1 E-6 F5000
	G90
	{% if act_z < max_z %}
		G1 Z{z_safe} F1500
	{% else %}
		G1 Z{act_z + 1} F1500
	{% endif %}
	T0
	G1 X10 Y10 F18000
	BUZZER_END
	TURN_OFF_HEATERS
	M82
	COOLDOWN
	M106 S255
	RESPOND PREFIX="[+]" MSG="Охлаждение сопла до 60 градусов"
	TEMPERATURE_WAIT SENSOR=extruder MAXIMUM={SHUTDOWN_TEMP}
	TEMPERATURE_WAIT SENSOR=extruder1 MAXIMUM={SHUTDOWN_TEMP}
	{% if svv.change_poweroff %}
		RESPOND PREFIX="[+]" MSG="Принтер выключается"
		M81
	{% else %}
		FIRMWARE_RESTART
	{% endif %}

[gcode_macro PID_CALIBRATE_HOTEND0]
description: Запуск макроса автокалибровки PID левой головы (T0).
gcode:
	{% set T_TARGET = params.T_TARGET | default(235) | float %}
	{% set poz_x = printer.toolhead.axis_maximum.x|float / 2 %}
	{% set poz_y = printer.toolhead.axis_maximum.y|float / 2 %}
	{% if "xyz" not in printer.toolhead.homed_axes %}
		G28
	{% endif %}
	G21
	G90
	T0
	G1 X{poz_x} Y{poz_y} Z100 F10000
	RESPOND PREFIX="[+]" MSG="Калибровка PID левой головы (T0) запущена"
	PID_CALIBRATE HEATER=extruder TARGET={T_TARGET}
	RESPOND PREFIX="[+]" MSG="Калибровка PID левой головы (T0) завершена"
	SAVE_CONFIG

[gcode_macro PID_CALIBRATE_HOTEND1]
description: Запуск макроса автокалибровки PID правой головы (T1).
gcode:
	{% set T_TARGET = params.T_TARGET | default(235) | float %}
	{% set poz_x = printer.toolhead.axis_maximum.x|float / 2 %}
	{% set poz_y = printer.toolhead.axis_maximum.y|float / 2 %}
	{% if "xyz" not in printer.toolhead.homed_axes %}
		G28
	{% endif %}
	G21
	G90
	T1
	G1 X{poz_x} Y{poz_y} Z100 F10000
	RESPOND PREFIX="[+]" MSG="Калибровка PID правой головы (T1) запущена"
	PID_CALIBRATE HEATER=extruder1 TARGET={T_TARGET}
	RESPOND PREFIX="[+]" MSG="Калибровка PID правой головы (T1) завершена"
	SAVE_CONFIG

[gcode_macro UNSAFE_LOWER_BED]
description: Опустить стол на 10мм вниз без парковки.
gcode:
	G90
	SET_KINEMATIC_POSITION Z=0
	G0 Z10 F600
	M84

[gcode_macro Z_MAX]
description: Опустить стол вниз. Убедитесь,что под столом нет посторонних предметов.
gcode:
	G90
	{% set act_z = printer.toolhead.position.z|float %}
	{% set act_y = printer.toolhead.position.y|float %}
	{% set act_x = printer.toolhead.position.x|float %}
	{% set z_max = printer.toolhead.axis_maximum.z|float - 10 %}
	{% if act_z < z_max %}
		G1 X{act_x} Y{act_y} Z{z_max} F900 
	{% endif %}

[gcode_macro G34]
description: Выравнивание стола по 4 углам
gcode:
	QUAD_GANTRY_LEVEL

[gcode_macro EDIT_T_CALIBRATE]
description: Установите температуру хотенда при калибровке (температуру, при которой филамент достаточно размягчен, чтобы не влиять на показания автоуровня).
gcode:
	{% set T_CALIBRATE = params.T_CALIBRATE | default(160) %}
	SAVE_VARIABLE VARIABLE=t_calibrate VALUE={T_CALIBRATE}
	RESPOND PREFIX="[+]" MSG="Температура калибровки - {T_CALIBRATE} градусов"

[gcode_macro CHANGE_T_STAB]
description: Нажатие активирует или отключает термостабилизацию при начале печати.
gcode: 
	{% set svv = printer.save_variables.variables %}
	{% if svv.t_stab %}
	SAVE_VARIABLE VARIABLE=t_stab VALUE=False
	RESPOND PREFIX="[+]" MSG="Термостабилизация отключена"
	{% else %}
	SAVE_VARIABLE VARIABLE=t_stab VALUE=True
	RESPOND PREFIX="[+]" MSG="Термостабилизация активирована"
	{% endif %}
