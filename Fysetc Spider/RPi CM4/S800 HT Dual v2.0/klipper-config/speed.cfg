
[gcode_macro M220]
rename_existing: M220.1
description: Установить масштаб скорости, запомнив его
variable_pending: 0.0
variable_pending_at: 0.0
variable_window: 60.0
gcode:
	{% if params.S is not defined %}
		M220.1
	{% else %}
		{% set want = params.S|float %}
		{% set current = (printer.gcode_move.speed_factor * 100.0)|round(1) %}
		{% set now = printer.print_stats.print_duration|float %}
		{% if (want - 100.0)|abs < 0.01 %}
			{% if (current - 100.0)|abs > 0.5 %}
				SET_GCODE_VARIABLE MACRO=M220 VARIABLE=pending VALUE={current}
				SET_GCODE_VARIABLE MACRO=M220 VARIABLE=pending_at VALUE={now}
			{% endif %}
		{% else %}
			SET_GCODE_VARIABLE MACRO=M220 VARIABLE=pending VALUE=0
		{% endif %}
		M220.1 S{want}
	{% endif %}

[gcode_macro RESTORE_SPEED_FACTOR]
description: Вернуть масштаб скорости, сброшенный слайсером. Вызывать в конце T0/T1
gcode:
	{% set g = printer['gcode_macro M220'] %}
	{% set s = g.pending|float %}
	{% set age = printer.print_stats.print_duration|float - g.pending_at|float %}
	{% if s > 0 and age <= g.window|float %}
		M220.1 S{s}
		SET_GCODE_VARIABLE MACRO=M220 VARIABLE=pending VALUE=0
	{% elif s > 0 %}
		SET_GCODE_VARIABLE MACRO=M220 VARIABLE=pending VALUE=0
	{% endif %}
