[gcode_macro START_PRINT]
description:
gcode:
  {% set T_BED = params.T_BED | default(90) | float %}
  {% set T_EXTRUDER = params.T_EXTRUDER | default(240) | float %}
  {% set T_CHAMBER = params.T_CHAMBER | default(0) | float %}
  RESPOND PREFIX="[+]" MSG="Подготовка к печати"
  G21 ;metric values
  G90 ;absolute positioning
  M82 ;set extruder to absolute mode
  M107 ;start with the fan off
  G28 X0 Y0 Z0 ;home all
  RESPOND PREFIX="[+]" MSG="Включен нагрев стола до рабочей температуры"
  M140 S{T_BED}
  RESPOND PREFIX="[+]" MSG="Включен нагрев хотенда до температуры калибровки"
  M104 S160
  {% if T_CHAMBER != 0 %} 
  RESPOND PREFIX="[+]" MSG="Включен нагрев камеры до рабочей температуры"
  SET_HEATER_TEMPERATURE HEATER=chamber TARGET={T_CHAMBER}
  {% endif %}  
  G1 X10 Y10 Z50 F900
  M190 S{T_BED}
  M109 S160
  RESPOND PREFIX="[+]" MSG="Термостабилизация - 3 минуты"
  G4 P180000 ;pause
  RESPOND PREFIX="[+]" MSG="Термостабилизация завершена"
  G4 P1000
  RESPOND PREFIX="[+]" MSG="Автовыравнивание стола"
  G34 ;bed tilt adjustment
  RESPOND PREFIX="[+]" MSG="Снятие карты неровностей"
  BED_MESH_CALIBRATE ADAPTIVE=1 ;auto bed level
  G1 Z3 F1200 ;move the platform up 3mm
  G1 X0 Y0 F12000
  G1 Z0 F1200 ;move the platform down
  RESPOND PREFIX="[+]" MSG="Включен нагрев хотенда до рабочей температуры"
  M104 S{T_EXTRUDER}
  M109 S{T_EXTRUDER}
  G1 Z3 F6000 ;move the platform up 3mm
  G92 E0 ;zero the extruded length
  RESPOND PREFIX="[+]" MSG="Печать линии прочистки сопла"
  INTRO_LINE
  RESPOND PREFIX="[+]" MSG="Начало печати"

[gcode_macro INTRO_LINE]
description: Печать линии прочистки сопла.
gcode:
  G92 E0
  G1 X0 Y0 F5000
  G1 Z0.2 F2000
  G1 X50 E10 F1500
  G1 X100 E18 F1000
  G92 E0

[gcode_macro END_PRINT]
description: Макрос окончания печати.
gcode:
  {% set svv = printer.save_variables.variables %}
  {% set T_CHAMBER = params.T_CHAMBER | default(0) | float %}
  {% set T_BED = params.T_BED | default(100) | float %}
  {% set COOLDOWN_TIME = params.COOLDOWN_TIME | default(120) | float %}
  {% set SHUTDOWN_TEMP = params.SHUTDOWN_TEMP | default(60) | float %}
  SAVE_VARIABLE VARIABLE=target_chamb VALUE={T_CHAMBER}
  SAVE_VARIABLE VARIABLE=target_bed VALUE={T_BED} 
  SAVE_VARIABLE VARIABLE=cooldown_time VALUE={COOLDOWN_TIME}  
  G91 ;relative positioning
  G1 E-2 F2000 ;start retract
  G1 Z+3 E-6 F5000 ;continue retract
  G90 ;absolute positioning
  G28 X0 Y0
  TURN_OFF_HEATERS
  M82
  COOLDOWN
  RESPOND PREFIX="[+]" MSG="Опустить стол вниз"
  Z_MAX
  M106 S255
  RESPOND PREFIX="[+]" MSG="Охлаждение сопла до 60 градусов"
  SET_FAN_SPEED FAN=Chamber_fan SPEED=1
  TEMPERATURE_WAIT SENSOR=extruder MAXIMUM={SHUTDOWN_TEMP}
  {% if svv.change_poweroff %}
  	RESPOND PREFIX="[+]" MSG="Принтер выключается"
  	M81 # Выключить принтер
  {% endif %}

[gcode_macro COOLDOWN]
description: Отпуск детали
gcode:
  {% set svv = printer.save_variables.variables %}
  {% set TARGET_CHAMB = svv.target_chamb %}                                     # начальная целевая температура камеры при отпуске из переменной target_chamb
  {% set TARGET_BED = svv.target_bed %}                                         # целевая температура стола при отпуске из переменной target_bed
  {% set COOLDOWN_TIME = svv.cooldown_time * 60000  %}                          # целевое время отпуска из переменной cooldown_time (в файле - в минутах, в этой строке переводим в микросекунды)
  {% set CUR_TEMP = printer['heater_generic chamber'].temperature | float %}    # текущая температура камеры
  {% set N = ((TARGET_CHAMB - 30)/10) | round(0, 'ceil') | int %}               # расчетное количество итераций отпуска с опусканием температуры на 10 градусов за одну итерацию  
  {% set DELTA_TIME = (COOLDOWN_TIME / N) | round(1) | float %}                 # расчетное время одной итерации в микросекундах                                 
  {% set DISPLAYED_TIME = (DELTA_TIME / 60000) | round(1) %}                    # отображаемое расчетное время одной итерации в минутах
  {% set ALL_DISPLAYED_TIME = (DISPLAYED_TIME * N) | round(1) %}                # отображаемое расчетное общее время отпуска в минутах
  SAVE_VARIABLE VARIABLE=tchamb_temp VALUE={TARGET_CHAMB}                       # записываем в переменную tchamb_temp начальную целевую температуру камеры при отпуске
  SAVE_VARIABLE VARIABLE=delta_time VALUE={DELTA_TIME}                          # записываем в переменную delta_time расчетное время одной итерации в микросекундах

  {% if TARGET_CHAMB > 40 %}                                                    # Если целевая температура отпуска задана начинаем отпуск 
    RESPOND PREFIX="[+]" MSG="Начинаем отпуск детали"
    SET_HEATER_TEMPERATURE HEATER=heater_bed TARGET={TARGET_BED}                # включаем нагрев стола до целевой температуры
    RESPOND PREFIX="[+]" MSG="Общее время ожидания {ALL_DISPLAYED_TIME} минут"
    {% for i in range(10, 0, -1) %}                                             # запускаем цикл из 10 шагов 
      _SET_CHTEMP                                                               # задаем целевую температуру камеры через макрос _SET_CHTEMP
      RESPOND PREFIX="[+]" MSG="Время ожидания итерации {DISPLAYED_TIME} минут"
      _WAIT_CHTEMP # T_CHAMBER={T_CHAMBER} COOLDOWN_TIME={COOLDOWN_TIME}        # задаем задержку ожидания одной итерации с проверкой текущей температуры камеры _WAIT_CHTEMP T_CHAMBER={T_CHAMBER} COOLDOWN_TIME={COOLDOWN_TIME}  
    {% endfor %}
    RESPOND PREFIX="[+]" MSG="Отпуск детали завершён"
    SET_HEATER_TEMPERATURE HEATER=chamber TARGET=0                              # Выключаем нагрев камеры по окончании отпуска
  {% endif %}

[gcode_macro _SET_CHTEMP]                                                       # МАКРОС УСТАНОВКИ ЦЕЛЕВОЙ ТЕМПЕРАТУРЫ КАМЕРЫ
gcode:
  {% set svv = printer.save_variables.variables %}
  SET_HEATER_TEMPERATURE HEATER=chamber TARGET={svv.tchamb_temp}                # задаем целевую температуру камеры из переменной tchamb_temp
  RESPOND PREFIX="[+]" MSG="Температура отпуска = {svv.tchamb_temp} градусов"  # отображаем целевую температуру камеры

[gcode_macro _WAIT_CHTEMP]                                                      # МАКРОС УСТАНОВКИ ВРЕМЕНИ ЗАДЕРЖКИ ОДНОЙ ИТЕРАЦИИ С ПРОВЕРКОЙ ТЕМПЕРАТУРЫ КАМЕРЫ
gcode:
  {% set svv = printer.save_variables.variables %}                              
  {% set DELTA_TIME = svv.delta_time %}                                         # расчетное время одной итерации в микросекундах из переменной delta_time
  {% set CUR_TEMP = printer['heater_generic chamber'].temperature|float %}      # текущая температура камеры
  
  {% if CUR_TEMP > 35 %}                                                        # если текущая температура камеры больше 35 градусов 
    G4 P{DELTA_TIME}                                                            # задаем задержку ожидания для одной итерации
    _CHECK_CHTEMP                                                               # макрос проверки соответствия температуры камеры целевой по окончании итерации отпуска
    {% else %}
    RESPOND PREFIX="[+]" MSG="Температура камеры ниже 35 градусов, дальше отпускать смысла нету, пропускаем итерацию)))"
  {% endif %} 

[gcode_macro _CHECK_CHTEMP]                                                     # МАКРОС ПРОВЕРКИ ТЕМПЕРАТУРЫ. ЕСЛИ ПО ОКОНЧАНИИ ИТЕРАЦИИ ОТПУСКА ТЕМПЕРАТУРА КАМЕРЫ ОПУСТИЛАСЬ ДО ЦЕЛЕВОЙ, ПРОДОЛЖАЕМ ДАЛЬШЕ.  
gcode:                                                                          # ЕСЛИ НЕТ - ОПУСКАЕМ ТЕМПЕРАТУРУ СТОЛА НА 10 ГРАДУСОВ, ЖДЕМ 10 МИНУТ И ПЕРЕЗАПУСКАЕМ ИТЕРАЦИЮ С ТОЙ ЖЕ ТЕМПЕРАТУРОЙ КАМЕРЫ.
  {% set svv = printer.save_variables.variables %}
  {% set CUR_TEMP = printer['heater_generic chamber'].temperature|float %}      # текущая температура камеры
  {% set TARGET_CHAMB = printer['heater_generic chamber'].target|float %}       # целевая температура камеры
  {% set TARGET_BED = (printer.heater_bed.temperature - 10)|float %}            # целевая температура СТОЛА для случая превышения целевой температуры КАМЕРЫ ( текущая минус 10 градусов)

  RESPOND PREFIX="[+]" MSG="Целевая температура камеры {TARGET_CHAMB}"
  RESPOND PREFIX="[+]" MSG="Текущая температура камеры {CUR_TEMP}"

  {% if TARGET_CHAMB < (CUR_TEMP - 2) %}                                        # если текущая температура камеры на 2 градуса выше целевой
    SET_HEATER_TEMPERATURE HEATER=heater_bed TARGET={TARGET_BED}                # опускаем температуру стола на 10 градусов
    RESPOND PREFIX="[+]" MSG="Температура камеры выше целевой, опускаем температуру стола на 10 градусов и повторяем итерацию"
    SAVE_VARIABLE VARIABLE=tchamb_temp VALUE={printer['heater_generic chamber'].target|float}  # записываем в переменную tchamb_temp целевую температуру камеры ТАКУЮ ЖЕ, КАК В ПРЕДЫДУЩЕЙ ИТЕРАЦИИ
    RESPOND PREFIX="[+]" MSG="Целевая иемпература стола {TARGET_BED} градусов"
    {% else %}                                                                  # если текущая температура камеры соответствует целевой
   RESPOND PREFIX="[+]" MSG="Температура камеры соответствует целевой, опускаем температуру камеры на 10 градусов и переходим к следующей итерации"
    SAVE_VARIABLE VARIABLE=tchamb_temp VALUE={printer['heater_generic chamber'].target |float -10} # опускаем целевую температуру камеры на 10 градусов и записываем в переменную tchamb_temp
  {% endif %}
  
[gcode_macro PAUSE]
description: Пауза
rename_existing: PAUSE_BASE
variable_extrude: 1.0
gcode:
  {% if printer.pause_resume.is_paused == True %}
      RESPOND PREFIX="[+]" MSG="Принтер уже в паузе" 
  {% else %}
    {% if printer.idle_timeout.state == "Printing" %}
      {% set E = printer["gcode_macro PAUSE"].extrude|float %}
      {% set max_z = printer.toolhead.axis_maximum.z|float - 5 %}
      {% set act_z = printer.toolhead.position.z|float %}
      {% set z_safe = act_z + 5 %}
      SAVE_GCODE_STATE NAME=PAUSE_state
      PAUSE_BASE
      G91
      G1 E-{E} F2100
      G90
      {% if act_z < max_z %}
        G1 Z{z_safe} F1500
      {% else %}
        G1 Z1 F1500
      {% endif %}
      G1 X10 Y10 F10000
      RESPOND PREFIX="[+]" MSG="Пауза"
    {% else %}
      RESPOND PREFIX="[+]" MSG="Печать не запущена. Отмена паузы"
    {% endif %}
  {% endif %}

[gcode_macro RESUME]
description: Продолжить печать.
rename_existing: RESUME_BASE
gcode:
  {% if printer.pause_resume.is_paused == True %}
    {% set E = printer["gcode_macro PAUSE"].extrude|float %}
    G91
    G1 E{E} F2100
    RESTORE_GCODE_STATE NAME=PAUSE_state
    RESUME_BASE
    RESPOND PREFIX="[+]" MSG="Продолжаем печать"
  {% else %}
    RESPOND PREFIX="[+]" MSG="Принтер не в паузе"
  {% endif %}
  
[gcode_macro CANCEL_PRINT]
description: Отменить печать.
rename_existing: CANCEL_PRINT_BASE
gcode:
  RESPOND PREFIX="[+]" MSG="Печать отменена. Опускаем стол вниз"
  Z_MAX
  G28 X Y
  RESTART

[gcode_macro PID_CALIBRATE_HOTEND]
description: Запуск макроса автокалибровки PID хотенда.
gcode:
    {% set T_TARGET = params.T_TARGET | default(235) | float %}
    {% set poz_x = printer.toolhead.axis_maximum.x|float / 2 %}
    {% set poz_y = printer.toolhead.axis_maximum.y|float / 2 %}
    {% if "xyz" not in printer.toolhead.homed_axes %}
      G28
    {% endif %}
    G21                                                   # metric values
    G90                                                   # Переключение в режим абсолютных координат
    G1 X{poz_x} Y{poz_y} Z100 F2000
    RESPOND PREFIX="[+]" MSG="Калибровка PID хотенда начата"
    PID_CALIBRATE HEATER=extruder TARGET={T_TARGET}
    RESPOND PREFIX="[+]" MSG="Калибровка PID хотенда завершена"
    SAVE_CONFIG

[gcode_macro PID_CALIBRATE_BED]
description: Запуск макроса автокалибровки PID стола.
gcode:
    {% set T_TARGET = params.T_TARGET | default(90) | float %}
    {% if "xyz" not in printer.toolhead.homed_axes %}
      G28
    {% endif %}
    G21                                                   # Метрическая система изменения
    G90                                                   # Переключение в режим абсолютных координат
    G1 Z100 F2000
    RESPOND PREFIX="[+]" MSG="Калибровка PID стола начата"
    PID_CALIBRATE HEATER=heater_bed TARGET={T_TARGET}
    RESPOND PREFIX="[+]" MSG="Калибровка PID стола завершена"
    SAVE_CONFIG

[gcode_macro FILAMENT_DRYING]
description: Макрос сушки филамента в камере принтера.
gcode:
  {% set T_TARGET = params.T_TARGET | default(60) | int %}
  {% set TIME = params.TIME | default(8) | float *3600000 %}
  {% set max_chamber_temp = printer.configfile.settings['heater_generic chamber'].max_temp  %}
  {% if "xyz" not in printer.toolhead.homed_axes %}
    G28
  {% endif %}
  G90
  G1 Z100 F2400
  RESPOND PREFIX="[+]" MSG="Включаем нагрев камеры и стола до установленной температуры"
  {% if T_TARGET < ( max_chamber_temp - 5 ) %}
    SET_HEATER_TEMPERATURE HEATER=chamber TARGET={T_TARGET}
  {% else %}
    SET_HEATER_TEMPERATURE HEATER=chamber TARGET={max_chamber_temp - 5}
  {% endif %}
  SET_HEATER_TEMPERATURE HEATER=heater_bed TARGET={T_TARGET}
  RESPOND PREFIX="[+]" MSG="Время сушки {TIME / 3600000} ч"
  G4 P{TIME}
  RESPOND PREFIX="[+]" MSG="Сушка окончена. Нагреватели выключены"
  TURN_OFF_HEATERS
  {% if svv.change_poweroff %}
  	RESPOND PREFIX="[+]" MSG="Принтер выключается"
  	M81
  {% endif %}

[gcode_macro Z_MAX]
description: Опустить стол вниз. Убедитесь,что под столом нет посторонних предметов.
gcode:
  G90
  {% set act_z = printer.toolhead.position.z|float %}
  {% set act_y = printer.toolhead.position.y|float %}
  {% set act_x = printer.toolhead.position.x|float %}
  {% set z_max = printer.toolhead.axis_maximum.z|float - 5 %}
  {% if act_z < z_max %}
    G1 X{act_x} Y{act_y} Z{z_max} F900 
  {% endif %}
