########################################
# HEATERS configuration
########################################
[extruder]
step_pin: PD5 # E0-MOTOR
dir_pin: PD6 # E0-MOTOR
enable_pin: !PD4 # E0-MOTOR
microsteps: 16
rotation_distance: 5.65 # HGX
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: PC8 # HEAT1
sensor_type: PT1000
sensor_pin: PC0 # T0
min_temp: 5
max_temp: 450
max_extrude_cross_section: 100
max_extrude_only_distance: 1000
pressure_advance: 0.03

[verify_heater extruder]
max_error: 300
check_gain_time: 180
hysteresis: 10
heating_gain: 2

[extruder1]
step_pin: PE2 # E2-MOTOR
dir_pin: PE4 # E2-MOTOR
enable_pin: !PE3 # E2-MOTOR
microsteps: 16
rotation_distance: 5.63 # HGX
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: PB3 # HEAT2
sensor_type: PT1000
sensor_pin: PC1 # T1
min_temp: 5
max_temp: 450
max_extrude_cross_section: 100
max_extrude_only_distance: 1000
pressure_advance: 0.03

[verify_heater extruder1]
max_error: 300
check_gain_time: 180
hysteresis: 10
heating_gain: 2

[heater_bed]
heater_pin: PB4 # BED-OUT
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PB0 # TB
min_temp: 0
max_temp: 165

[temperature_sensor Chamber]
sensor_type: PT1000
sensor_pin: PC2 #T2
min_temp: 5
max_temp: 100

[temperature_sensor RPICM4]
sensor_type: temperature_host

[temperature_sensor MCU]
sensor_type: temperature_mcu