########################################
# HEATERS configuration
########################################
[extruder]
step_pin: PD5 # E0-MOTOR
dir_pin: !PD6 # E0-MOTOR
enable_pin: !PD4 # E0-MOTOR
microsteps: 16
rotation_distance: 5.68 # HGX
nozzle_diameter: 0.600
filament_diameter: 1.750
heater_pin: PB15 # HEAT0
sensor_type: PT1000
sensor_pin: PC0
min_temp: 5
max_temp: 420
max_extrude_cross_section: 100
max_extrude_only_distance: 1000
pressure_advance: 0.046

[verify_heater extruder]
max_error: 240
check_gain_time: 60
hysteresis: 7
heating_gain: 2

[extruder_stepper _pulling_extruder]
extruder: extruder
step_pin: PC12
dir_pin: PD2
enable_pin: !PD1
microsteps: 16
rotation_distance: 23.05
pressure_advance: 0.046

[extruder1]
step_pin: PE1 # E4-MOTOR
dir_pin: !PE0 # E4-MOTOR
enable_pin: !PC5 # E4-MOTOR
microsteps: 16
rotation_distance: 5.68 # HGX
nozzle_diameter: 0.600
filament_diameter: 1.750
heater_pin: PC8 # HEAT1
sensor_type: PT1000
sensor_pin: PC1 # T1
min_temp: 5
max_temp: 420
max_extrude_cross_section: 100
max_extrude_only_distance: 1000
pressure_advance: 0.046

[verify_heater extruder1]
max_error: 240
check_gain_time: 60
hysteresis: 7
heating_gain: 2

[extruder_stepper _pulling_extruder1]
extruder: extruder1
step_pin: PC10
dir_pin: PC11
enable_pin: !PD0
microsteps: 16
rotation_distance: 23
pressure_advance: 0.046

[heater_bed]
heater_pin: PB4 # BED-OUT
sensor_type: temperature_combined
sensor_list: temperature_sensor _Bed_0, temperature_sensor _Bed_1
combination_method: mean
maximum_deviation: 20
min_temp: 0
max_temp: 155

[temperature_sensor _Bed_0]
sensor_type: PT1000
sensor_pin: PB0 # TB
min_temp: 5
max_temp: 155

[temperature_sensor _Bed_1]
sensor_type: PT1000
sensor_pin: PB1 # T4
min_temp: 5
max_temp: 155

[heater_generic chamber]
gcode_id: chamber
heater_pin: PB3 # HEAT2
sensor_type: PT1000
sensor_pin: PC2 # T2
control: pid
pid_Kp: 68
pid_Ki: 1.5
pid_Kd: 1500
min_temp: 5
max_temp: 95

[verify_heater chamber]
max_error: 1200
check_gain_time: 2400
hysteresis: 10
heating_gain: 1

[temperature_sensor RPICM4]
sensor_type: temperature_host

[temperature_sensor MCU]
sensor_type: temperature_mcu