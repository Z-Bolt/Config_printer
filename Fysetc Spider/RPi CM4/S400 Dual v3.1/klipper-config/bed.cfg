########################################
# BED LEVEL configuration
########################################
[probe]
pin: PA0
x_offset: 0.0
y_offset: 0.0
z_offset: -1.19
speed: 0.8
lift_speed: 25
samples: 1
sample_retract_dist: 2.0
samples_result: average
samples_tolerance: 0.04
samples_tolerance_retries: 0

[bed_mesh]
speed: 180
horizontal_move_z: 2
mesh_min:
    10,0
mesh_max:
    410,390
probe_count: 6,6

[gcode_macro G29]
description: Автокалибровка карты.
gcode:
  {% if "xy" not in printer.toolhead.homed_axes %}
    G28 X Y
  {% endif %}
  {% if "z" not in printer.toolhead.homed_axes %}
    G28 Z
  {% endif %}
  BED_MESH_CALIBRATE

[gcode_macro GZ0]
gcode:
  RESPOND PREFIX="[+]" MSG="Значение Z0 - {printer.probe.last_z_result|round(3)}"
  SAVE_VARIABLE VARIABLE=z0 VALUE={printer.probe.last_z_result|round(3)} #записываем координату Z в переменную z0

[gcode_macro GZ1]
gcode:
  RESPOND PREFIX="[+]" MSG="Значение Z1 - {printer.probe.last_z_result|round(3)}"
  SAVE_VARIABLE VARIABLE=z1 VALUE={printer.probe.last_z_result|round(3)} #записываем координату Z в переменную z0
  
[gcode_macro GZ2]
gcode:
  RESPOND PREFIX="[+]" MSG="Значение Z2 - {printer.probe.last_z_result|round(3)}"
  SAVE_VARIABLE VARIABLE=z2 VALUE={printer.probe.last_z_result|round(3)} #записываем координату Z в переменную z0

[gcode_macro GZ3]
gcode:
  RESPOND PREFIX="[+]" MSG="Значение Z3 - {printer.probe.last_z_result|round(3)}"
  SAVE_VARIABLE VARIABLE=z3 VALUE={printer.probe.last_z_result|round(3)} #записываем координату Z в переменную z0

[gcode_macro z_info]
description: bed tilt info
gcode:
  {% set svv = printer.save_variables.variables %}
  RESPOND PREFIX="[+]" MSG="Текущая позиция Z - {printer.gcode_move.gcode_position.z}"
  RESPOND PREFIX="[+]" MSG="Z0 - {svv.z0}"
  RESPOND PREFIX="[+]" MSG="Z1 - {svv.z1}"
  RESPOND PREFIX="[+]" MSG="Z2 - {svv.z2}"
  RESPOND PREFIX="[+]" MSG="Z3 - {svv.z3}"

[gcode_macro quad_z_tilt_adjust]
gcode:
  {% set svv = printer.save_variables.variables %}
  RESPOND PREFIX="[+]" MSG="Выполнение автовыравнивания стола..."
  RESPOND PREFIX="[+]" MSG="Перемещаем Z0 на {svv.z0}мм"
  FORCE_MOVE STEPPER=stepper_z DISTANCE={svv.z0} VELOCITY=1 ACCEL=5
  G4 P2000
  M400
  RESPOND PREFIX="[+]" MSG="Перемещаем Z1 на {svv.z1}мм"
  FORCE_MOVE STEPPER=stepper_z1 DISTANCE={svv.z1} VELOCITY=1 ACCEL=5
  G4 P2000
  M400
  RESPOND PREFIX="[+]" MSG="Перемещаем Z2 на {svv.z2}мм"
  FORCE_MOVE STEPPER=stepper_z2 DISTANCE={svv.z2} VELOCITY=1 ACCEL=5
  G4 P2000
  M400
  RESPOND PREFIX="[+]" MSG="Перемещаем Z3 на {svv.z3}мм"
  FORCE_MOVE STEPPER=stepper_z3 DISTANCE={svv.z3} VELOCITY=1 ACCEL=5
  G4 P2000
  M400

[gcode_macro G34]
description: Автокалибровка стола. Выравнивание горизонта стола по 4-м точкам.
gcode:
  {% if "xy" not in printer.toolhead.homed_axes %}
  G28 X Y
  {% endif %}
  {% if "z" not in printer.toolhead.homed_axes %}
  G28 Z
  {% endif %}
    G1 Z10 F1200
    G1 X10 Y0 F12000
    PROBE
    GZ0 ; macros - save probe result to Z0 variable
    G1 Z10 F1200
    G1 X10 Y350 F12000
    PROBE
    GZ1 ; macros - save probe result to Z1 variable
    G1 Z10 F1200
    G1 X410 Y350 F12000
    PROBE
    GZ2 ; macros - save probe result to Z2 variable
    G1 Z10 F1200
    G1 X410 Y0 F12000
    PROBE
    GZ3 ; macros - save probe result to Z3 variable
    z_info
    G1 Z10 F1200
    G1 X210 Y200 F12000
    ;выравниваем плоскоть стола ...
    quad_z_tilt_adjust
    RESPOND PREFIX="[+]" MSG="Автовыравнивание стола завершено"
