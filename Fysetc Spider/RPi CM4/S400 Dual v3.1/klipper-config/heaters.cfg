########################################
# HEATERS configuration
########################################
[extruder]
step_pin: PD5 # E0-MOTOR
dir_pin:  PD6 # E0-MOTOR
enable_pin: !PD4 # E0-MOTOR
microsteps: 16
rotation_distance: 5.68 # HGX
nozzle_diameter: 0.600
filament_diameter: 1.750
heater_pin: PB15 # HEAT0
sensor_type: PT1000
sensor_pin: PC0
min_temp: 5
max_temp: 430
max_extrude_cross_section: 100
max_extrude_only_distance: 1000
pressure_advance: 0.046

[verify_heater extruder]
max_error: 240
check_gain_time: 60
hysteresis: 7
heating_gain: 2

[extruder_stepper _pulling_extruder]
extruder: extruder
step_pin: PC12 # EXP1
dir_pin: PD2 # EXP1
enable_pin: !PD1 # EXP1
microsteps: 16
rotation_distance: 23.2 
pressure_advance: 0.046

[extruder1]
step_pin: PE6 # E1-MOTOR
dir_pin:  PC13 # E1-MOTOR
enable_pin: !PE5 # E1-MOTOR
microsteps: 16
rotation_distance: 5.69 # HGX
nozzle_diameter: 0.600
filament_diameter: 1.750
heater_pin: PC8 # HEAT1
sensor_type: PT1000
sensor_pin: PC1 # T1
min_temp: 5
max_temp: 430
max_extrude_cross_section: 100
max_extrude_only_distance: 1000
pressure_advance: 0.046

[verify_heater extruder1]
max_error: 240
check_gain_time: 60
hysteresis: 7
heating_gain: 2

[extruder_stepper _pulling_extruder1]
extruder: extruder1
step_pin: PC10 # EXP1
dir_pin: PC11 # EXP1
enable_pin: !PD0 # EXP1
microsteps: 16
rotation_distance: 23.2
pressure_advance: 0.046

[heater_bed]
heater_pin: PB4 # BED-OUT
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PB0 # TB
min_temp: 5
max_temp: 155

[heater_generic chamber]
gcode_id: chamber
heater_pin: PB3 # HEAT2
sensor_type: PT1000
sensor_pin: PC2 # T2
min_temp: 5
max_temp: 95

[verify_heater chamber]
max_error: 1200
check_gain_time: 2400
hysteresis: 10
heating_gain: 1

[temperature_sensor RPICM4]
sensor_type: temperature_host

[temperature_sensor MCU]
sensor_type: temperature_mcu