########################################
# TOOLS configuration
########################################
# Вся логика тулченджера вынесена в расширение zbolt_toolchanger:
#   ~/klipper/klippy/extras/zbolt_toolchanger.py
#   ~/klipper/klippy/extras/zbolt_toolchanger_tool.py
# Документация и матрица аварийных ситуаций — zbolt_toolchanger.md
#
# Команды T0 и T1 регистрирует само расширение, макросов T0/T1 здесь нет.
# Координаты перенесены из toolchanger-settings.cfg этого принтера
# (S/N ZBS352686) один в один; safe-точки раньше считались в макросах
# как park+55 / park-25.
# Скорости — в мм/с: speed_fast 18000 -> 300, speed_slow 3600 -> 60.

[zbolt_toolchanger]
initial_tool: 0
# Опрос датчиков синхронизирован с реальным движением (toolhead.wait_moves),
# поэтому вместо прежней слепой задержки G4 P2000 хватает окна стабильности.
sensor_settle_time: 0.05
verify_retries: 1
travel_speed: 300
dock_speed: 60
force_speed_factor: 100
z_lift_before_home: 5
z_after_home: 10
z_lift_speed: 15
home_axes_order: y, x
after_home_position: 59.0, 430.1
# slider_sensor_pin: ^PXX   # сработал = на слайдере есть голова     # датчик наличия головы на слайдере (в планах)
# Общий Z-офсет (бэбистеп), переносимый между головами
global_offset_variable: z_adjust
# Сервисный режим настройки парковок: TOOLCHANGER_SERVICE_MODE
service_mode_variable: service_mode
apply_offset_gcode:
    _SET_GCODE_OFFSET_INTERNAL X={x} Y={y} Z={z}
# Раньше T0/T1 были обёрнуты в UNSKEW ... SKEW
before_change_gcode:
    UNSKEW
after_change_gcode:
    SKEW
on_fault_both_undocked: pause
on_fault_head_lost: pause
on_fault_slider_unexpected: pause
on_fault_park_failed: pause
on_fault_get_failed: pause
on_fault_unexpected_edge: pause
on_fault_sensor_unstable: error
on_fault_startup: error

[zbolt_toolchanger_tool t0]
tool_number: 0
extruder: extruder
dock_sensor_pin: ^!PA1                   # бывш. [gcode_button t0_parking]
park_xy: 4.0, 455.1                     # бывш. t0x_park / t0y_park
unpark_xy: 4.0, 455.1                   # бывш. t0x_unpark / t0y_unpark
safe_xy: 59.0, 430.1                    # бывш. t0x_park + 55 / t0y_park - 25
retreat_speed: slow
coupling: latch
release_jerk: 0                          # бывш. t0y_jerk
current_boost: 1.6                       # бывш. SET_TMC_CURRENT x1.6
current_boost_phase: park
wipe_moves:                              # вытирание об сопливчик, от safe_xy
    0, 25
    -10, 25
    -10, 0
    0, 0
offset_z_variable: t0offset

[zbolt_toolchanger_tool t1]
tool_number: 1
extruder: extruder1
dock_sensor_pin: ^!PA2                   # бывш. [gcode_button t1_parking]
park_xy: 416.4, 455.4                   # бывш. t1x_park / t1y_park
unpark_xy: 416.4, 455.4                 # бывш. t1x_unpark / t1y_unpark
safe_xy: 361.4, 430.4                   # бывш. t1x_park - 55 / t1y_park - 25
retreat_speed: slow
coupling: latch
release_jerk: 0                          # бывш. t1y_jerk
current_boost: 1.6
current_boost_phase: park
wipe_moves:
    0, 25
    10, 25
    10, 0
    0, 0
offset_x_variable: t1_x_offset
offset_y_variable: t1_y_offset
offset_z_variable: t1_z_offset

########################################
# Совместимость со старыми именами
########################################

[gcode_macro Zoffset]
description: Макрос автокалибровки z-офсета 2-й головы. Запускайте его при снятии или замене хотендов.
gcode:
    TOOLCHANGER_CALIBRATE_OFFSET TOOL=1

[gcode_macro PARKING_STATE]
description: Показать, какая голова на слайдере, а какая в парковке.
gcode:
    TOOLCHANGER_STATUS
