########################################
# TOOLS configuration
########################################

[zbolt_toolchanger]
initial_tool: 0
sensor_settle_time: 0.05
verify_retries: 1
travel_speed: 300
dock_speed: 60
force_speed_factor: 100
z_lift_before_home: 5
z_after_home: 10
z_lift_speed: 15
home_axes_order: y, x
after_home_position: 59.0, 430.1
# slider_sensor_pin: ^PXX               # датчик наличия головы на слайдере (в планах)
global_offset_variable: z_adjust
service_mode_variable: service_mode
apply_offset_gcode: _SET_GCODE_OFFSET_INTERNAL X={x} Y={y} Z={z}
before_change_gcode: UNSKEW
after_change_gcode: SKEW
on_fault_both_undocked: pause
on_fault_head_lost: pause
on_fault_slider_unexpected: pause
on_fault_park_failed: pause
on_fault_get_failed: pause
on_fault_unexpected_edge: pause
on_fault_sensor_unstable: error
on_fault_startup: error

[zbolt_toolchanger_tool t0]
tool_number: 0
extruder: extruder
dock_sensor_pin: ^!PA1
park_xy: 4.0, 455.1                     # t0x_park / t0y_park
unpark_xy: 4.0, 455.1                   # t0x_unpark / t0y_unpark
safe_xy: 59.0, 430.1                    # t0x_park + 55 / t0y_park - 25
retreat_speed: slow
coupling: latch
release_jerk: 0                         
current_boost: 1.6                      
current_boost_phase: park
wipe_moves:                              # вытирание об сопливчик, от safe_xy
	0, 25
	-10, 25
	-10, 0
	0, 0
offset_z_variable: t0offset
after_change_gcode: RESTORE_SPEED_FACTOR

[zbolt_toolchanger_tool t1]
tool_number: 1
extruder: extruder1
dock_sensor_pin: ^!PA2                  
park_xy: 416.4, 455.4                   # t1x_park / t1y_park
unpark_xy: 416.4, 455.4                 # t1x_unpark / t1y_unpark
safe_xy: 361.4, 430.4                   # 1x_park - 55 / t1y_park - 25
retreat_speed: slow
coupling: latch
release_jerk: 0                          
current_boost: 1.6
current_boost_phase: park
wipe_moves:
	0, 25
	10, 25
	10, 0
	0, 0
offset_x_variable: t1_x_offset
offset_y_variable: t1_y_offset
offset_z_variable: t1_z_offset
after_change_gcode: RESTORE_SPEED_FACTOR

[gcode_macro Zoffset]
description: Макрос автокалибровки z-офсета 2-й головы. Запускайте его при снятии или замене хотендов.
gcode:
	TOOLCHANGER_CALIBRATE_OFFSET TOOL=1

[gcode_macro PARKING_STATE]
description: Показать, какая голова на слайдере, а какая в парковке.
gcode:
	TOOLCHANGER_STATUS
