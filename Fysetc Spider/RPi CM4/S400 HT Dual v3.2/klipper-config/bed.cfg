# [bed_mesh]
# speed: 400
# horizontal_move_z: 2
# mesh_min: 10,10
# mesh_max: 390,390
# probe_count: 16,16
# algorithm: bicubic
# bicubic_tension: 0.1
# # bicubic_tension: 0
# # mesh_pps: 3,3
# mesh_pps: 0,0
# zero_reference_position: 200,200

[bed_mesh]
speed: 400
horizontal_move_z: 1
mesh_min: 10,10
mesh_max: 390,390
probe_count: 16,16
algorithm: bicubic
bicubic_tension: 0.05
zero_reference_position: 200, 200

[gcode_macro G29]
description: Автокалибровка карты.
gcode:
  {% if "xy" not in printer.toolhead.homed_axes %}
    G28 X Y
  {% endif %}
  {% if "z" not in printer.toolhead.homed_axes %}
    G28 Z
  {% endif %}
  BED_MESH_CALIBRATE

[quad_gantry_level]
gantry_corners: 
    -55, -40
    470, 355
points:
    10, 10
    10, 390
    400, 390
    400, 10
speed: 400 # 300
retries: 7
retry_tolerance: 0.05
horizontal_move_z: 10

[gcode_macro SET_GCODE_OFFSET]
rename_existing: _SET_GCODE_OFFSET_ORIGINAL
gcode:
	_SET_GCODE_OFFSET_ORIGINAL {rawparams}
	# Расчёт отдан расширению: оно вычитает собственный офсет активной головы,
	# иначе подстройка на второй голове утащила бы в общий офсет ещё и t1_z_offset.
	TOOLCHANGER_SAVE_ADJUST
[gcode_macro _SET_GCODE_OFFSET_INTERNAL]
gcode:
	_SET_GCODE_OFFSET_ORIGINAL {rawparams}

# Общий Z-офсет и офсет активной головы восстанавливает
# расширение zbolt_toolchanger при старте.

[axis_twist_compensation]
speed: 400
horizontal_move_z: 1
calibrate_start_x: 10
calibrate_end_x: 390
calibrate_y: 200
calibrate_start_y: 10
calibrate_end_y: 390
calibrate_x: 200
