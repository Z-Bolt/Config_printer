########################################
# BED LEVEL configuration
########################################
[probe]
pin: PA0
x_offset: 0.0
y_offset: 0.0
z_offset: -1.04
speed: 3 # 0.8
lift_speed: 25
samples: 1
sample_retract_dist: 1 # 2.0
samples_result: average
samples_tolerance: 0.04
samples_tolerance_retries: 0

# [bed_mesh]
# speed: 180
# horizontal_move_z: 2
