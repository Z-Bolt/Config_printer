########################################
# BED LEVEL configuration
########################################

[probe]
pin: PA0 # Z-MIN
x_offset: 0.0
y_offset: 0.0
z_offset: -1.00
speed: 3
lift_speed: 25
samples: 1
sample_retract_dist: 2
samples_result: average
samples_tolerance: 0.04
samples_tolerance_retries: 0

[bed_mesh]
speed: 400
horizontal_move_z: 2
mesh_min: 10,10
mesh_max: 390,390
probe_count: 11,11
algorithm: bicubic
bicubic_tension: 0.1

[gcode_macro G29]
description: Автокалибровка карты.
gcode:
	{% if "xy" not in printer.toolhead.homed_axes %}
	G28 X Y
	{% endif %}
	{% if "z" not in printer.toolhead.homed_axes %}
	G28 Z
	{% endif %}
	BED_MESH_CALIBRATE

[quad_gantry_level]
gantry_corners: 
	-55, -40
	470, 355
points:
	10, 10
	10, 390
	400, 390
	400, 10
speed: 400
retries: 10
retry_tolerance: 0.05
horizontal_move_z: 10

[gcode_macro SET_GCODE_OFFSET]
rename_existing: _SET_GCODE_OFFSET_ORIGINAL
gcode:
	_SET_GCODE_OFFSET_ORIGINAL {rawparams}
	TOOLCHANGER_SAVE_ADJUST

[gcode_macro _SET_GCODE_OFFSET_INTERNAL]
gcode:
	_SET_GCODE_OFFSET_ORIGINAL {rawparams}

[axis_twist_compensation]
speed: 400
horizontal_move_z: 3
calibrate_start_x: 10
calibrate_end_x: 390
calibrate_y: 200
calibrate_start_y: 10
calibrate_end_y: 390
calibrate_x: 200
