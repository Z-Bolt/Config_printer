[homing_override]
gcode:
  HOMING
set_position_z: 0

[gcode_macro HOMING]
gcode:
	parking_state
	{% set svv = printer.save_variables.variables %}
	{% set ActiveTool = printer.toolhead.extruder %}
	{% set Parking0State = printer['gcode_button t0_parking'].state %}
	{% set Parking1State = printer['gcode_button t1_parking'].state %}
	parking_state
	{% if (Parking0State == "PRESSED") and (Parking1State == "PRESSED") %}
	M118 Зачем на преступление толкаете?! Верните одну голову на парковку!!!
	{% else %}
	G91
	G1 Z2 F900
	G28 Y
	G28 X
	G90
	{% if ActiveTool == "extruder" %}
	{% if (Parking0State == "RELEASED") and (Parking1State == "RELEASED") %}
	GET_extruder
	{% else %}
	{% if (Parking0State == "RELEASED") and (Parking1State == "PRESSED") %}
	PARK_extruder1
	GET_extruder
	{% endif %}
	GET_extruder
	{% endif %}
	{% else %}
	{% if (Parking0State == "RELEASED") and (Parking1State == "RELEASED") %}
	ACTIVATE_EXTRUDER EXTRUDER=extruder
	GET_EXTRUDER
	{% else %}
	{% if (Parking0State == "RELEASED") and (Parking1State == "PRESSED") %}
	PARK_extruder1
	ACTIVATE_EXTRUDER EXTRUDER=extruder
	GET_EXTRUDER
	{% else %}
	ACTIVATE_EXTRUDER EXTRUDER=extruder
	GET_extruder
	{% endif %}
	{% endif %}
	{% endif %}
	G90
	G1 X150 Y150 F9000
	G28 Z
	G1 Z2 F900
	G1 X10 Y290 F9000
	{% endif %}
